<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eko</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage" data-eyes="open" data-brows="none" data-mood="normal">
    <div id="pod">
    <div id="bubble" aria-live="polite"></div>
    <div id="thought"><i></i><i></i><i></i></div>
    <div id="zz"><span>z</span><span>z</span><span>z</span></div>
    <div id="sweat"></div>
    <div id="badge"></div>
    <div id="boxes"></div>
    <div id="fx"></div>

    <svg id="mochi" viewBox="-120 -125 240 310" aria-label="Eko">
      <defs>
        <radialGradient id="clay" cx="35%" cy="28%" r="85%">
          <stop offset="0" stop-color="#fffaf5" />
          <stop offset=".55" stop-color="#efe2d8" />
          <stop offset="1" stop-color="#c7b0a2" />

        <radialGradient id="sheet" cx="38%" cy="25%" r="90%">
          <stop offset="0" stop-color="#ffffff" />
          <stop offset=".6" stop-color="#f1f3f8" />
          <stop offset="1" stop-color="#c9cedb" />
        </radialGradient>
        <radialGradient id="pumpkin" cx="35%" cy="30%" r="80%">
          <stop offset="0" stop-color="#ffb35c" />
          <stop offset="1" stop-color="#e06d12" />
        </radialGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe08a" />
          <stop offset="1" stop-color="#e2a52a" />
        </linearGradient>
        <filter id="blur9" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" /></filter>
        <filter id="blur4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" /></filter>
        <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" /></filter>
        <clipPath id="headClip"><path d="M-100,8 C-100,-80 -50,-104 0,-104 C50,-104 100,-80 100,8 C100,44 70,58 0,58 C-70,58 -100,44 -100,8Z" /></clipPath>
        <clipPath id="bodyClip"><rect x="-52" y="40" width="104" height="106" rx="46" /></clipPath>
        <g id="boxArt">
          <path d="M-28,-18 L-20,-28 L36,-28 L28,-18Z" fill="#e9c08a" />
          <path d="M28,-18 L36,-28 L36,12 L28,22Z" fill="#b8834c" />
          <rect x="-28" y="-18" width="56" height="40" rx="3" fill="#d6a46a" />
          <path d="M-4,-18 L4,-18 L12,-28 L4,-28Z" fill="#f4dcb0" />
          <rect x="-4" y="-18" width="8" height="40" fill="#f4dcb0" />
          <rect x="9" y="-6" width="15" height="10" rx="1.5" fill="#fffaf2" />
          <path d="M12,-2 L21,-2 M12,1.5 L18,1.5" stroke="#b9a48c" stroke-width="1.4" />
        </g>
      </defs>

      <ellipse id="shadow" cx="0" cy="176" rx="72" ry="11" fill="#2a1a12" opacity=".28" filter="url(#blur9)" />

      <g id="pet">
        <!-- Complementos detrás del cuerpo -->
        <g id="accBack">
          <g id="cape" data-fly="cape">
            <path d="M-46,48 Q0,60 46,48 C66,92 74,132 84,166 Q42,154 0,174 Q-42,154 -84,166 C-74,132 -66,92 -46,48Z" fill="#c8303c" />
            <path d="M-30,56 C-40,100 -44,140 -40,160 M0,62 L0,170 M30,56 C40,100 44,140 40,160" fill="none" stroke="#a1222e" stroke-width="4" opacity=".6" />
          </g>
          <g data-acc="vampire">
            <path d="M-46,52 C-104,40 -128,-20 -118,-74 C-96,-36 -72,-6 -30,30Z" fill="#1e1a26" />
            <path d="M-44,48 C-92,36 -112,-12 -108,-56 C-90,-26 -70,-2 -34,30Z" fill="#a3203a" />
            <path d="M46,52 C104,40 128,-20 118,-74 C96,-36 72,-6 30,30Z" fill="#1e1a26" />
            <path d="M44,48 C92,36 112,-12 108,-56 C90,-26 70,-2 34,30Z" fill="#a3203a" />
          </g>
        </g>
        <g id="legs">
          <g id="legL"><rect x="-36" y="118" width="30" height="58" rx="15" fill="url(#clay)" /></g>
          <g id="legR"><rect x="6" y="118" width="30" height="58" rx="15" fill="url(#clay)" /></g>
        </g>
        <g id="armL"><ellipse cx="-60" cy="92" rx="14" ry="34" transform="rotate(12 -60 92)" fill="url(#clay)" /></g>
        <g id="armR"><ellipse cx="60" cy="92" rx="14" ry="34" transform="rotate(-12 60 92)" fill="url(#clay)" /></g>
        <g id="upper">
          <g id="body">
            <rect x="-52" y="40" width="104" height="106" rx="46" fill="url(#clay)" />
            <g clip-path="url(#bodyClip)"><ellipse id="bodyHl" cx="-22" cy="88" rx="14" ry="26" fill="#fff" opacity=".35" filter="url(#blur4)" /><ellipse cx="0" cy="50" rx="62" ry="15" fill="#6b4f43" opacity=".35" filter="url(#blur4)" /></g>
          </g>
          <!-- Complementos sobre el cuerpo -->
          <g id="accBody">
            <g data-fly="cape"><path d="M-30,50 Q0,62 30,50" fill="none" stroke="#a1222e" stroke-width="7" stroke-linecap="round" /><circle cx="0" cy="58" r="7" fill="url(#gold)" /></g>
            <g data-acc="vampire">
              <path d="M-50,50 C-72,86 -72,130 -60,150 L-44,146 C-50,112 -46,80 -28,56Z" fill="#1e1a26" />
              <path d="M50,50 C72,86 72,130 60,150 L44,146 C50,112 46,80 28,56Z" fill="#1e1a26" />
              <path d="M-14,54 L0,72 L14,54Z" fill="#f4f1ee" />
            </g>
            <g data-acc="scarf">
              <path d="M-58,44 Q0,70 58,44 L60,62 Q0,90 -60,62Z" fill="#d43c3c" />
              <path d="M-40,52 L-34,72 M-14,58 L-10,80 M14,58 L10,80 M40,52 L34,72" stroke="#fbf6f0" stroke-width="7" />
              <path d="M18,66 L38,64 L44,118 L22,120Z" fill="#c33434" />

          </g>
          <g id="head">
            <path d="M-100,8 C-100,-80 -50,-104 0,-104 C50,-104 100,-80 100,8 C100,44 70,58 0,58 C-70,58 -100,44 -100,8Z" fill="url(#clay)" />
            <g clip-path="url(#headClip)"><ellipse id="hl" cx="-42" cy="-68" rx="34" ry="13" fill="#fff" opacity=".45" filter="url(#blur4)" /></g>
            <ellipse id="mouth" cx="0" cy="40" rx="5" ry="0" fill="#3a2520" />

              <circle cx="0" cy="0" r="15" fill="#d9a35f" /><circle cx="0" cy="0" r="12" fill="#e8b874" />

            </g>
            <g id="eyes">
              <line id="bridge" x1="-20" y1="20" x2="20" y2="20" />

                <ellipse class="blush" cx="-12" cy="17" rx="13" ry="6" fill="#f2907e" filter="url(#blur3)" />
                <g class="open"><circle r="6.5" fill="#1d1614" /><circle cx="2" cy="-2" r="1.6" fill="#fff" opacity=".8" /></g>
                <path class="line happy" d="M-7,2 Q0,-7 7,2" />
                <path class="line closed" d="M-7,0 Q0,5 7,0" />
                <path class="line spiral" d="M0,0 m-2,0 a2,2 0 1,1 4,0 a4,4 0 1,1 -8,0 a6,6 0 1,1 12,0 a8,8 0 1,1 -16,0" />
                <path class="line brow" d="M-8,-11 Q0,-16 8,-11" />
                <circle class="rim" r="12" />
              </g>
              <g class="eye eye-r" transform="translate(32 20)">
                <ellipse class="blush" cx="12" cy="17" rx="13" ry="6" fill="#f2907e" filter="url(#blur3)" />
                <g class="open"><circle r="6.5" fill="#1d1614" /><circle cx="2" cy="-2" r="1.6" fill="#fff" opacity=".8" /></g>
                <path class="line happy" d="M-7,2 Q0,-7 7,2" />
                <path class="line closed" d="M-7,0 Q0,5 7,0" />
                <path class="line spiral" d="M0,0 m-2,0 a2,2 0 1,1 4,0 a4,4 0 1,1 -8,0 a6,6 0 1,1 12,0 a8,8 0 1,1 -16,0" />
                <path class="line brow" d="M-8,-11 Q0,-16 8,-11" />
                <circle class="rim" r="12" />
              </g>
            </g>
            <!-- Complementos de la cara (siguen el giro de los ojos) -->
            <g id="accFace">
              <g data-acc="vampire"><path d="M-9,36 L-5,46 L-1,36Z M1,36 L5,46 L9,36Z" fill="#fff" stroke="#e5ddd6" stroke-width=".8" /></g>
              <g data-acc="reindeer">
                <ellipse cx="0" cy="36" rx="10" ry="8.5" fill="#d8323a" />
                <ellipse cx="-3" cy="33" rx="3.5" ry="2.2" fill="#fff" opacity=".7" />
              </g>
            </g>
            <!-- Complementos de la cabeza -->
            <g id="hat">
              <g data-acc="santa">
                <path d="M40,-108 C72,-118 104,-100 110,-70 C112,-60 106,-54 100,-57 C98,-80 82,-94 56,-96Z" fill="#c93232" />
                <path d="M-88,-54 C-90,-104 -40,-122 8,-118 C54,-114 86,-94 90,-58 Q0,-40 -88,-54Z" fill="#d93d3d" />

                <path d="M-92,-52 Q0,-36 94,-56" fill="none" stroke="#fbf6f0" stroke-width="20" stroke-linecap="round" />
                <circle cx="103" cy="-56" r="12" fill="#fbf6f0" />
              </g>
              <g data-acc="elf">
                <path d="M30,-106 C70,-130 112,-128 128,-98 C118,-104 100,-106 82,-96 L64,-84Z" fill="#2f9a57" />

                <path d="M-90,-54 Q0,-38 92,-58" fill="none" stroke="#f2c14e" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" />
                <circle cx="129" cy="-96" r="8" fill="url(#gold)" />
              </g>
              <g data-acc="reindeer">
                <path d="M-46,-92 C-54,-116 -62,-130 -78,-140 M-58,-118 C-72,-118 -82,-112 -90,-104 M-66,-132 C-62,-144 -60,-152 -52,-160" fill="none" stroke="#8a5a36" stroke-width="9" stroke-linecap="round" />
                <path d="M46,-92 C54,-116 62,-130 78,-140 M58,-118 C72,-118 82,-112 90,-104 M66,-132 C62,-144 60,-152 52,-160" fill="none" stroke="#8a5a36" stroke-width="9" stroke-linecap="round" />
              </g>
              <g data-acc="witch">
                <ellipse cx="0" cy="-66" rx="114" ry="18" fill="#2f2440" transform="rotate(-5 0 -66)" />
                <path d="M-50,-72 C-40,-104 -22,-150 2,-176 C12,-186 26,-186 36,-178 C28,-172 20,-168 16,-160 C26,-128 40,-100 52,-74 Z" fill="#4a3863" />
                <path d="M-48,-84 C-20,-92 22,-94 50,-86 L52,-74 C22,-82 -20,-80 -50,-72Z" fill="#f0a23b" />
                <rect x="-8" y="-92" width="16" height="15" rx="2" fill="none" stroke="#ffd27a" stroke-width="3" />
                <path d="M-114,-60 C-60,-44 60,-48 113,-74" fill="none" stroke="#3a2d50" stroke-width="5" stroke-linecap="round" />
              </g>
              <g data-acc="pumpkin">
                <path d="M-4,-96 C-8,-112 -2,-124 10,-130 L15,-124 C6,-118 6,-108 8,-96Z" fill="#6b4a24" />
                <path d="M10,-118 C24,-134 44,-130 50,-116 C36,-112 22,-110 10,-118Z" fill="#4c9a45" />
                <ellipse cx="-70" cy="-14" rx="50" ry="72" fill="#d9640f" />
                <ellipse cx="70" cy="-14" rx="50" ry="72" fill="#d9640f" />
                <ellipse cx="-38" cy="-18" rx="54" ry="80" fill="#ec7a1a" />
                <ellipse cx="38" cy="-18" rx="54" ry="80" fill="#ec7a1a" />
                <ellipse cx="0" cy="-20" rx="48" ry="84" fill="url(#pumpkin)" />
                <ellipse cx="-30" cy="-70" rx="22" ry="10" fill="#ffd49a" opacity=".35" filter="url(#blur4)" />
                <g class="carve" id="carveL"><path d="M-11,7 L0,-11 L11,7Z" fill="#ffd34d" stroke="#7a3208" stroke-width="2.5" stroke-linejoin="round" /></g>
                <g class="carve" id="carveR"><path d="M-11,7 L0,-11 L11,7Z" fill="#ffd34d" stroke="#7a3208" stroke-width="2.5" stroke-linejoin="round" /></g>
                <g id="carveMouth"><path d="M-36,26 Q0,52 36,26 L28,34 L18,28 L9,38 L0,31 L-9,38 L-18,28 L-28,34Z" fill="#ffd34d" stroke="#7a3208" stroke-width="2.5" stroke-linejoin="round" /></g>
              </g>
              <g data-acc="party">
                <g transform="translate(-24 -92) rotate(-14)">
                  <path d="M-38,4 L0,-92 L38,4 Z" fill="#5fb3e8" />
                  <path d="M-30,-16 L30,-16 L35,-4 L-35,-4Z M-20,-44 L20,-44 L24,-32 L-24,-32Z M-9,-70 L9,-70 L13,-60 L-13,-60Z" fill="#ffd25a" />
                  <path d="M-40,4 Q0,14 40,4" fill="none" stroke="#f26a8d" stroke-width="7" stroke-linecap="round" />
                  <circle cx="0" cy="-94" r="10" fill="#f26a8d" />
                </g>
              </g>
              <g data-acc="crown">
                <path d="M-56,-86 L-62,-140 L-34,-112 L0,-150 L34,-112 L62,-140 L56,-86 Q0,-74 -56,-86Z" fill="url(#gold)" stroke="#c98b17" stroke-width="2" />
                <circle cx="-62" cy="-142" r="6" fill="#ffe08a" /><circle cx="0" cy="-152" r="7" fill="#ffe08a" /><circle cx="62" cy="-142" r="6" fill="#ffe08a" />
                <circle cx="0" cy="-100" r="7" fill="#e2445f" /><circle cx="-32" cy="-96" r="5" fill="#4b8de8" /><circle cx="32" cy="-96" r="5" fill="#3bb36b" />
              </g>
            </g>
          </g>
        </g>
        <!-- Paquete que sostiene -->
        <g id="heldBox" style="display:none"><use href="#boxArt" /></g>
        <!-- Disfraz de fantasma: cubre todo -->
        <g id="accFront">
          <g data-acc="ghost">
            <path id="ghostSheet" d="M-108,12 C-108,-90 -54,-118 0,-118 C54,-118 108,-90 108,12 L88,170 L-88,170Z" fill="url(#sheet)" />
            <g id="ghostEyes"><ellipse cx="-32" cy="16" rx="11" ry="15" fill="#1d1614" /><ellipse cx="32" cy="16" rx="11" ry="15" fill="#1d1614" /></g>
          </g>
        </g>
      </g>
    </svg>

    <div id="hit"></div>
    </div>
    <div id="menu"></div>
  </div>
  <script src="main.js"></script>
  <script src="senses.js"></script>

</body>
