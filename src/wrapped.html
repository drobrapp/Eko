<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuestra semana</title>
<style>
:root{--ink:#3b2f2a;--cream:#fff4e8;--coral:#d0795a;--honey:#e9a93b;--sage:#5fa88e;--lav:#9b85cc;--blue:#6f94c2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink);user-select:none}
#dim{position:fixed;inset:0;background:rgba(32,22,40,.62);opacity:0;transition:opacity .5s}
body.on #dim{opacity:1}
#story{position:fixed;left:50%;top:50%;width:min(430px,92vw);height:min(760px,92vh);transform:translate(-50%,-50%) scale(.92);opacity:0;transition:transform .5s cubic-bezier(.2,1.4,.4,1),opacity .4s;border-radius:34px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
body.on #story{transform:translate(-50%,-50%) scale(1);opacity:1}
.card{position:absolute;inset:0;padding:74px 34px 40px;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0;pointer-events:none;transition:opacity .45s}
.card.on{opacity:1}
.card h2{margin:0 0 6px;font:700 25px/1.2 "Segoe Print","Comic Sans MS",cursive}
.card p{margin:6px 0;font-size:17px;line-height:1.4;max-width:330px}
.card .big{font:800 86px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:-2px;margin:18px 0 4px}
.card .unit{font-size:20px;font-weight:700;opacity:.8}
.card .art{width:150px;height:150px;object-fit:contain;margin:auto 0 0;filter:drop-shadow(0 10px 14px rgba(60,30,20,.25));animation:float 3.2s ease-in-out infinite}
.card .art.small{width:96px;height:96px}
.card .arts{display:flex;gap:10px;margin:auto 0 0}
@keyframes float{50%{transform:translateY(-10px) rotate(-3deg)}}
.pill{display:inline-block;margin-top:10px;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.55);font-weight:700;font-size:15px}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;margin:26px 0 6px;width:100%;justify-content:center}
.bar{width:30px;border-radius:10px 10px 6px 6px;background:rgba(255,255,255,.55);height:4px;transition:height 1s cubic-bezier(.2,1.3,.4,1);position:relative}
.bar.top{background:#fff}
.bar span{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;opacity:.8}
.hint{position:absolute;bottom:16px;left:0;right:0;font-size:13px;opacity:.6}
#bars{position:absolute;top:16px;left:16px;right:16px;display:flex;gap:5px;z-index:5}
#bars i{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.4);overflow:hidden}
#bars i b{display:block;height:100%;width:0;background:#fff}
#close{position:absolute;top:28px;right:16px;z-index:6;border:0;background:rgba(255,255,255,.5);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:34px;color:var(--ink);cursor:pointer}
#nav{position:absolute;inset:0;display:flex;z-index:4}#nav div{flex:1;cursor:pointer}
.btns{display:flex;gap:10px;margin-top:18px;position:relative;z-index:7}
.btns button{border:0;border-radius:18px;padding:11px 18px;font:700 15px "Segoe UI",system-ui,sans-serif;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(60,30,20,.18)}
.btns button.main{background:var(--ink);color:#fff}
canvas{position:fixed;inset:0;pointer-events:none;z-index:10}
.t0{background:linear-gradient(160deg,#fbd6c4,#e9a98c)}.t1{background:linear-gradient(160deg,#fde3ae,#e9b45a)}.t2{background:linear-gradient(160deg,#cfe9de,#86c2aa)}
.t3{background:linear-gradient(160deg,#e3dbf5,#ab98d8)}.t4{background:linear-gradient(160deg,#d6e4f4,#8fb0d6)}.t5{background:linear-gradient(160deg,#fff4e8,#f2cfae)}
</style></head><body>
<div id="dim"></div>
<div id="story"><div id="bars"></div><button id="close" aria-label="Cerrar">×</button><div id="nav"><div data-d="-1"></div><div data-d="1"></div></div></div>
<canvas id="fx"></canvas>
<script>
(() => {
  "use strict";
  const T = window.__TAURI__, invoke = T ? T.core.invoke : null;
  const get = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (_) { return d; } };
  const S = get("eko-stats", {}), cfg = get("eko-settings", {}), name = (cfg.petName || "Eko").trim();
  const dayKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const monday = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  let wk = null; try { wk = localStorage.getItem("eko-wrapped-week"); } catch (_) {}
  const mon = wk ? new Date(wk + "T00:00:00") : monday(new Date());
  const days = [...Array(7)].map((_, i) => { const d = new Date(mon); d.setDate(d.getDate() + i); return d; });
  const prev = days.map((d) => { const x = new Date(d); x.setDate(x.getDate() - 7); return x; });
  const sum = (list, k) => list.reduce((a, d) => a + ((S[dayKey(d)] || {})[k] || 0), 0);
  const W = (k) => sum(days, k);
  const DN = ["lunes", "martes", "miércoles", "jueves", "viernes", "sábado", "domingo"], DS = ["L", "M", "X", "J", "V", "S", "D"];
  const MN = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  const fmtD = (d) => `${d.getDate()} de ${MN[d.getMonth()]}`;

  const min = W("min"), prevMin = sum(prev, "min");
  const perDay = days.map((d) => (S[dayKey(d)] || {}).min || 0);
  const best = perDay.indexOf(Math.max(...perDay));
  const hours = [...Array(24)].map((_, h) => W("h" + h)), peak = hours.indexOf(Math.max(...hours));
  const pet = W("pet") + W("hug"), feed = W("feed"), play = W("game") + W("play") + W("fetch") + W("trick");
  const harvest = W("carrot") + W("tomato") + W("apple"), water = W("waterPlant"), plant = W("plant"), orders = W("order"), weeds = W("weed");
  const talk = W("chat") + W("voice");
  const hm = (m) => m >= 60 ? [Math.floor(m / 60), "h", m % 60] : [m, "min", 0];

  const cards = [];
  cards.push({ t: 0, html: `<h2>Nuestra semana</h2><p>Del ${fmtD(days[0])} al ${fmtD(days[6])}</p><p>${name} ha preparado algo para ti…</p><img class="art" src="art/pic-portrait.webp" alt=""><div class="hint">Toca para avanzar</div>`, confetti: true });
  if (min > 0) {
    const [a, u, r] = hm(min), d = prevMin >= 60 ? Math.round((min - prevMin) / prevMin * 100) : null;
    cards.push({ t: 1, html: `<h2>Hemos pasado juntos</h2><div class="big" data-n="${a}">0</div><div class="unit">${u === "h" ? `horas${r ? ` y ${r} min` : ""}` : "minutos"}</div>${d != null ? `<span class="pill">${d >= 100 ? "¡Más del doble que la semana pasada!" : d >= 0 ? `¡${d} % más que la semana pasada!` : `${-d} % menos que la semana pasada… ¡te eché de menos!`}</span>` : ""}<img class="art" src="art/fx-heart.webp" alt="">` });
    const mx = Math.max(...perDay, 1);
    cards.push({ t: 2, html: `<h2>Tu día favorito</h2><div class="big" style="font-size:52px;letter-spacing:0">${DN[best]}</div><div class="bars">${perDay.map((v, i) => `<div class="bar${i === best ? " top" : ""}" data-h="${Math.max(4, v / mx * 170)}"><span>${DS[i]}</span></div>`).join("")}</div><p style="margin-top:30px">Ese día estuvimos ${hm(perDay[best]).slice(0, 2).join(" ")} juntos</p>` });
    const kind = peak < 6 ? ["búho", "Tú y yo de madrugada… somos un equipo nocturno"] : peak < 10 ? ["madrugador", "Empezamos el día juntos, ¡qué gusto!"] : peak < 14 ? ["de mañanas", "Las mañanas son lo nuestro"] : peak < 20 ? ["de tardes", "Las tardes contigo son las mejores"] : ["de noches", "Por las noches estamos más unidos"];
    cards.push({ t: 3, html: `<h2>Eres ${kind[0]}</h2><div class="big">${String(peak).padStart(2, "0")}:00</div><p>Nuestra hora favorita</p><p>${kind[1]}</p><img class="art small" src="art/fx-notes.webp" alt="">` });
  }
  if (pet) cards.push({ t: 0, html: `<h2>Mimos recibidos</h2><div class="big" data-n="${pet}">0</div><p>${pet > 50 ? "Creo que soy la criatura más mimada del escritorio" : pet > 15 ? "Cada caricia me pone la barriga blandita" : "Pocos pero bien dados"}</p><img class="art" src="art/fx-heart.webp" alt="">` });
  if (feed) cards.push({ t: 1, html: `<h2>Galletas zampadas</h2><div class="big" data-n="${feed}">0</div><p>${feed > 20 ? "Mi tripa y yo te damos las gracias" : "Ñam. Ni una miga se ha desperdiciado"}</p><img class="art" src="art/cookie.webp" alt="">` });
  if (play) cards.push({ t: 4, html: `<h2>Ratos de juego</h2><div class="big" data-n="${play}">0</div><p>${W("trick") ? `Incluidos ${W("trick")} trucos que me salieron… casi todos bien` : "¡Qué bien nos lo pasamos!"}</p><img class="art" src="art/ball.webp" alt="">` });
  if (harvest || water || plant) cards.push({ t: 2, html: `<h2>En el huerto</h2><div class="big" data-n="${harvest}">0</div><div class="unit">cosas cosechadas</div><p>${water} riegos · ${plant} semillas plantadas${weeds ? ` · ${weeds} malas hierbas fuera` : ""}</p>${orders ? `<span class="pill">${orders} encargo${orders > 1 ? "s" : ""} de Don Paja</span>` : ""}<div class="arts"><img class="art small" src="art/valley/g-carrot.webp" alt=""><img class="art small" src="art/valley/g-tomato.webp" alt=""></div>` });
  if (talk) cards.push({ t: 3, html: `<h2>Charlas</h2><div class="big" data-n="${talk}">0</div><p>veces que me has hablado. Me encanta escucharte</p><img class="art small" src="art/fx-ask.webp" alt="">` });
  const score = [["Maestría en mimos", pet * 2], ["Chef de galletas", feed * 3], ["As de los juegos", play * 2], ["Mano verde", (harvest + water + plant) * 2], ["Charla infinita", talk * 2], ["Compañía fiel", min / 20]].sort((a, b) => b[1] - a[1]);
  const titleW = score[0][1] > 0 ? score[0][0] : "Gran comienzo";
  cards.push({ t: 5, html: `<h2>Tu título de la semana</h2><div class="big" style="font-size:44px;letter-spacing:0;line-height:1.1">${titleW}</div><p>Gracias por esta semana. Me lo paso genial contigo</p><img class="art" src="art/medal.webp" alt=""><div class="btns"><button type="button" class="again">Ver otra vez</button><button type="button" class="main close2">Cerrar</button></div>`, confetti: true, last: true });

  const story = document.getElementById("story"), bars = document.getElementById("bars");
  const els = cards.map((c) => { const d = document.createElement("div"); d.className = `card t${c.t}`; d.innerHTML = c.html; story.appendChild(d); return d; });
  bars.innerHTML = cards.map(() => "<i><b></b></i>").join("");
  let i = -1, timer = 0, t0 = 0;
  const DUR = 6500;
  function countUp(el) {
    const n = +el.dataset.n, s = performance.now();
    const step = (t) => { const q = Math.min(1, (t - s) / 1100), e = 1 - Math.pow(1 - q, 3); el.textContent = Math.round(n * e); if (q < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  function show(n) {
    n = Math.max(0, Math.min(cards.length - 1, n)); if (n === i) return;
    i = n; els.forEach((e, k) => e.classList.toggle("on", k === i));
    [...bars.children].forEach((b, k) => { b.firstChild.style.width = k < i ? "100%" : "0"; });
    const el = els[i];
    el.querySelectorAll("[data-n]").forEach(countUp);
    el.querySelectorAll(".bar").forEach((b) => { b.style.height = "4px"; requestAnimationFrame(() => requestAnimationFrame(() => { b.style.height = b.dataset.h + "px"; })); });
    if (cards[i].confetti) burst();
    t0 = performance.now();
  }
  function tick(t) {
    if (i >= 0 && !cards[i].last) {
      const q = Math.min(1, (t - t0) / DUR); bars.children[i].firstChild.style.width = q * 100 + "%";
      if (q >= 1) show(i + 1);
    } else if (i >= 0) bars.children[i].firstChild.style.width = "100%";
    requestAnimationFrame(tick);
  }
  document.querySelectorAll("#nav div").forEach((d) => d.addEventListener("click", () => show(i + +d.dataset.d)));
  const close = () => { document.body.classList.remove("on"); setTimeout(() => { if (invoke) invoke("wrapped_hide").catch(() => window.close()); else window.close(); }, 400); };
  document.getElementById("close").addEventListener("click", close);
  story.addEventListener("click", (e) => { if (e.target.closest(".close2")) close(); else if (e.target.closest(".again")) { i = -1; show(0); } });
  document.getElementById("dim").addEventListener("click", close);
  addEventListener("keydown", (e) => { if (e.key === "Escape") close(); else if (e.key === "ArrowRight" || e.key === " ") show(i + 1); else if (e.key === "ArrowLeft") show(i - 1); });

  // confeti con los colores de Eko
  const cv = document.getElementById("fx"), cx = cv.getContext("2d"); let parts = [];
  const fit = () => { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); };
  fit(); addEventListener("resize", fit);
  const COLS = ["#d0795a", "#e9a93b", "#5fa88e", "#9b85cc", "#6f94c2", "#fff4e8"];
  function burst() {
    const r = story.getBoundingClientRect();
    for (let k = 0; k < 120; k++) parts.push({ x: r.left + r.width / 2, y: r.top + r.height * 0.35, vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 15 - 4, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4, w: 6 + Math.random() * 6, h: 4 + Math.random() * 5, c: COLS[k % COLS.length], life: 1 });
  }
  (function draw() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter((p) => p.life > 0 && p.y < innerHeight + 40);
    for (const p of parts) { p.vy += 0.38; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= 0.006; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.globalAlpha = Math.min(1, p.life * 2); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); }
    requestAnimationFrame(draw);
  })();
  requestAnimationFrame(() => { document.body.classList.add("on"); setTimeout(() => show(0), 350); });
  requestAnimationFrame(tick);
})();
</script>
</body></html>
