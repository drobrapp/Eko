<!doctype html>
<html><head><meta charset="utf-8"><title>El Valle de Eko</title>
<link rel="stylesheet" href="style.css" />
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9CC9EE;user-select:none;font:13px "Segoe UI",system-ui,sans-serif}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
#sky{position:fixed;inset:0;transition:background 3s}
#sun{position:fixed;width:110px;height:110px;background:center/contain no-repeat;transition:left 3s,top 3s,filter 3s;animation:spin 120s linear infinite}
@keyframes spin{to{rotate:360deg}}
body.night #sun{animation:none}
#stars i{position:fixed;width:2px;height:2px;border-radius:50%;background:#FFF4E8;opacity:0;transition:opacity 3s}
.night #stars i{opacity:.85}
.cloud{position:fixed;opacity:.92;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(150,175,205,.3))}
.layer{position:fixed;left:0;right:0;bottom:0;background-repeat:repeat-x;background-size:auto 100%;pointer-events:none}
#world{position:fixed;left:0;bottom:0;height:100%;will-change:transform}
.prop{position:absolute;pointer-events:auto;cursor:default;transform-origin:50% 100%}
.prop.interactable{cursor:pointer}
.prop img{width:100%;height:100%;display:block;pointer-events:none}
.prop.interactable:hover img,.plant:hover img{filter:drop-shadow(0 0 8px rgba(255,236,158,.78))}
.prop[data-garden-tool],.plant{touch-action:none;cursor:grab}
.prop[data-garden-tool]:active,.plant:active{cursor:grabbing}
.prop.sway{animation:sway 6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(1.2deg)}}
.prop.story-target img{animation:storyGlow 1.8s ease-in-out infinite alternate}
@keyframes storyGlow{to{filter:drop-shadow(0 0 18px rgba(255,236,158,.95))}}
.glow{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,rgba(255,214,140,.85),rgba(255,200,120,.25) 50%,transparent);opacity:0;transition:opacity 2s}
.lit .glow{opacity:1}
#eko{position:absolute;pointer-events:auto;cursor:pointer}
#eko #mochi{position:absolute;left:0;bottom:0;overflow:visible}
#bub{position:absolute;transform:translate(-50%,-100%);background:#fffaf6;color:#3b2f2a;padding:8px 13px;border-radius:15px;box-shadow:0 4px 14px rgba(50,30,20,.25);font-size:15px;max-width:300px;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;white-space:normal;cursor:pointer}
#bub.on{opacity:1}
#bub.on{pointer-events:auto}
#bub::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;margin-left:-7px;background:#fffaf6;transform:rotate(45deg);border-radius:0 0 4px 0}
#fogR,#fogL{position:absolute;bottom:0;height:100%;pointer-events:none}
#fogR{background:linear-gradient(90deg,rgba(255,255,255,0),rgba(250,248,244,.92) 35%,#f7f4ef 60%)}
#fogL{background:linear-gradient(270deg,rgba(255,255,255,0),rgba(250,248,244,.92) 35%,#f7f4ef 60%)}
.mist{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.9),transparent);animation:mist 9s ease-in-out infinite;pointer-events:none}
@keyframes mist{50%{transform:translateX(-40px) scale(1.1)}}
#signText{position:absolute;text-align:center;font:700 22px "Segoe Print","Comic Sans MS",cursive;color:#6b4a33;pointer-events:none;line-height:1.1}
#back{position:fixed;left:18px;top:16px;z-index:70;border:none;border-radius:18px;padding:9px 16px;background:#fffaf6;color:#5a463d;font:700 14px "Segoe UI",system-ui,sans-serif;box-shadow:0 4px 14px rgba(50,30,20,.25);cursor:pointer}
#title{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:50;font:700 20px "Segoe Print","Comic Sans MS",cursive;color:#fff;text-shadow:0 2px 6px rgba(40,30,60,.35);opacity:0;transition:opacity 1.2s;pointer-events:none}
#title.on{opacity:1}
#cover{position:fixed;inset:0;z-index:80;pointer-events:none;background:#fff;opacity:1;transition:opacity 1.2s}
#cover.off{opacity:0}
.flake{position:fixed;top:-10px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.9;pointer-events:none;animation:fall linear infinite}
.flake.leaf{width:9px;height:6px;border-radius:3px}
@keyframes fall{to{transform:translate(60px,110vh) rotate(300deg)}}
.plant{position:absolute;z-index:5;pointer-events:auto;cursor:grab;transform-origin:50% 100%;touch-action:none}
.plant img{width:100%;height:100%;display:block;pointer-events:none}
.garden-drag{position:fixed;z-index:100;width:76px;height:76px;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(40,30,20,.3));pointer-events:none;transform-origin:78% 45%;transition:transform .25s ease-out}
.garden-drag.pour{transform:rotate(-32deg)}
.drop,.dirt{z-index:36}
.drop.pourDrop{width:6px;height:11px;background:#7FB8EA}
.garden-drag.back{transition:left .3s ease-in-out,top .3s ease-in-out,transform .2s}
.plant.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{from{transform:scale(.2)}}
.plant .thirst{position:absolute;left:50%;top:-14px;width:10px;height:13px;margin-left:-5px;background:#7FB3E0;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;clip-path:polygon(50% 0,100% 60%,85% 95%,15% 95%,0 60%);opacity:0;transition:opacity .4s}
.plant.dry .thirst{opacity:.9;animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.prop.held{transition:none}
.drop{position:absolute;width:5px;height:9px;border-radius:50%;background:#8EC5F0;opacity:0;animation:drip .7s ease-in forwards}@keyframes drip{from{opacity:.95}to{transform:translateY(90px);opacity:0}}
.dirt{position:absolute;width:7px;height:7px;border-radius:50%;background:#7A4E2E;opacity:0;animation:dirt .6s ease-out forwards}@keyframes dirt{0%{opacity:1}100%{transform:translate(var(--dx),-40px);opacity:0}}
.pull{position:absolute;z-index:35;pointer-events:none;animation:pull 1.8s ease-out forwards}@keyframes pull{0%{transform:translateY(20px) scale(.6) rotate(-20deg)}30%{transform:translateY(-70px) scale(1) rotate(10deg)}70%{transform:translateY(-80px) scale(1) rotate(0)}100%{transform:translateY(-110px) scale(.9);opacity:0}}
.gtext{position:absolute;z-index:35;transform:translateX(-50%);font:700 26px "Segoe Print","Comic Sans MS",cursive;color:#fff;text-shadow:0 2px 6px rgba(120,30,20,.5);pointer-events:none;animation:up 1.9s ease-out forwards}@keyframes up{to{transform:translate(-50%,-60px);opacity:0}}
.prop::before{content:"";position:absolute;left:8%;right:8%;bottom:-4px;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(45,60,25,.38),rgba(45,60,25,0));z-index:-1;pointer-events:none}
.prop.held::before{display:none}
#ekoShadow{position:absolute;z-index:19;border-radius:50%;background:radial-gradient(closest-side,rgba(45,60,25,.35),rgba(45,60,25,0));pointer-events:none}
#sunflowers{position:absolute;z-index:3;pointer-events:none;background:url(art/valley/h-sunflowers.webp) repeat-x left bottom;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.plaque{position:absolute;text-align:center;font:700 20px "Segoe Print","Comic Sans MS",cursive;color:#6b4a33;pointer-events:none}
#interior{position:fixed;inset:0;z-index:60;display:none;overflow:hidden;background:transparent}
#interior.on{display:block;animation:houseIn .65s ease-out both}
@keyframes houseIn{from{opacity:0;transform:scale(1.025)}to{opacity:1;transform:none}}
#houseView{position:absolute;left:39.7%;top:15.6%;width:20.6%;height:38.3%;overflow:hidden;z-index:0;background:#9CC9EE;transition:background 2s;clip-path:inset(0 round 46% 46% 2% 2% / 28% 28% 2% 2%)}
#houseViewFar,#houseViewMid{position:absolute;left:-4%;right:-4%;background-repeat:repeat-x;background-position:center bottom;pointer-events:none}
#houseViewFar{bottom:20%;height:46%;background-image:url(art/valley/hills-far.webp);background-size:auto 100%;opacity:.82}
#houseViewMid{bottom:0;height:45%;background-image:url(art/valley/hills-mid.webp);background-size:auto 100%}
#houseSeason{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#houseSeason i{position:absolute;top:-7%;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.85;animation:houseFall linear infinite}
#houseSeason i.leaf{width:8px;height:5px;border-radius:4px 1px;opacity:.9}
@keyframes houseFall{to{transform:translate(14px,48vh) rotate(300deg)}}
#houseWindowSun{position:absolute;left:65%;top:9%;width:22%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 0 9px rgba(255,214,120,.5));animation:houseSun 70s linear infinite}
@keyframes houseSun{50%{transform:translate(-8px,4px)}}
.houseWindowCloud{position:absolute;left:4%;top:10%;width:37%;height:auto;opacity:.88;filter:drop-shadow(0 2px 2px rgba(90,130,170,.2));animation:houseCloud 32s ease-in-out infinite alternate}
@keyframes houseCloud{to{transform:translateX(20px)}}
body.night #houseView{filter:brightness(.57) saturate(.8)}
#houseRoom{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none}
#houseWallTint,#houseFloorTint{position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:multiply;mask-image:url(art/house-room.png);mask-mode:alpha;mask-size:100% 100%;-webkit-mask-image:url(art/house-room.png);-webkit-mask-size:100% 100%}
#houseWallTint{clip-path:inset(0 0 24% 0);-webkit-clip-path:inset(0 0 24% 0)}
#houseFloorTint{clip-path:inset(76% 0 0 0);-webkit-clip-path:inset(76% 0 0 0)}
#houseProps{position:absolute;inset:0;z-index:3;pointer-events:none}
.house-item{position:absolute;display:block;border:0;padding:0;background:transparent;pointer-events:auto;cursor:pointer;transform:translateX(-50%);transform-origin:50% 100%}
.house-item img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none}
.house-item.floor{filter:drop-shadow(0 7px 7px rgba(70,45,25,.18))}
.house-item.rug{filter:drop-shadow(0 4px 4px rgba(70,45,25,.15))}
.house-item.wall{filter:drop-shadow(0 5px 7px rgba(60,35,20,.2))}
.house-frame{position:absolute;border:0;padding:0;background:transparent;appearance:none;pointer-events:auto;cursor:pointer;transform:translateX(-50%);filter:drop-shadow(0 5px 7px rgba(60,35,20,.2))}
.house-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
.house-frame .art{inset:0;width:100%;height:100%;object-fit:contain}
.house-memento{position:absolute;display:grid;place-items:center;border:0;padding:0;background:transparent;cursor:pointer;pointer-events:auto;filter:drop-shadow(0 2px 2px rgba(60,35,20,.35))}
.house-memento img{width:100%;height:100%;object-fit:contain;pointer-events:none}
#houseActors{position:absolute;inset:0;z-index:8;pointer-events:none}
#houseActors #eko{z-index:8;pointer-events:auto}
#houseActors #ekoShadow{z-index:7}
#houseActors #bub{z-index:10}
#houseExit{position:absolute;left:2.2%;top:52%;width:7.5%;height:30%;border:0;background:transparent;cursor:pointer;z-index:9;opacity:0}
#houseExit:focus-visible,#houseStairs:focus-visible{outline:3px solid #fff;outline-offset:3px;opacity:.7}
#houseStairs{position:absolute;right:1.8%;bottom:21.5%;width:13%;height:37%;border:0;padding:0;background:transparent;cursor:pointer;z-index:2}
#houseStairs .step{position:absolute;left:0;bottom:0;width:72%;height:11%;border-radius:9px 4px 2px 2px;background:linear-gradient(155deg,#dbad78,#b47a4c);border:2px solid #9a6b42;box-shadow:inset 0 4px 0 rgba(255,238,200,.35),0 3px 5px rgba(50,30,20,.16)}
#houseStairs .step:nth-child(2){transform:translate(14%,-52%)}#houseStairs .step:nth-child(3){transform:translate(28%,-104%)}#houseStairs .step:nth-child(4){transform:translate(42%,-156%)}#houseStairs .step:nth-child(5){transform:translate(56%,-208%)}#houseStairs .step:nth-child(6){transform:translate(70%,-260%)}
#houseStairs .rail{position:absolute;left:7%;bottom:14%;width:78%;height:6%;border-radius:12px;background:#9a6b42;transform:rotate(-37deg);transform-origin:left center;box-shadow:0 3px 4px rgba(50,30,20,.2)}
#houseStairs .landing{position:absolute;right:0;top:0;width:31%;height:45%;border:5px solid #9a6b42;border-radius:20px 20px 7px 7px;background:linear-gradient(90deg,#bd8958,#dda97a 45%,#af7548);box-shadow:inset 5px 0 rgba(255,228,185,.3),0 5px 9px rgba(50,30,20,.18)}
#houseStairs .landing:after{content:"";position:absolute;left:14%;right:14%;top:12%;bottom:9%;border:3px solid rgba(121,77,45,.55);border-radius:12px 12px 4px 4px}
.bed-front{position:absolute;pointer-events:none;clip-path:inset(36% 0 0 0)}
#houseGallery{position:absolute;inset:8% 12%;z-index:20;display:none;overflow:auto;padding:3.5rem 2rem 2rem;border:10px solid #9a6b42;border-radius:32px;background:rgba(250,244,232,.97);box-shadow:0 18px 60px rgba(45,30,20,.4);grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:18px;align-content:start}
#houseGallery.on{display:grid}
#houseGallery button{min-height:120px;border:0;border-radius:18px;background:#fff8ed;padding:10px;color:#634734;font:600 13px "Segoe UI",system-ui,sans-serif;cursor:pointer}
#houseGallery img{width:74px;height:74px;object-fit:contain;display:block;margin:0 auto 8px}
#houseGalleryClose{position:fixed;right:14%;top:10%;z-index:21;border:0;border-radius:50%;width:42px;height:42px;background:#fff8ed;color:#634734;font-size:24px;cursor:pointer;display:none}
#houseGallery.on+#houseGalleryClose{display:block}
body.in-house #title{display:none}
/* Don Paja, encargos y cosas del huerto */
.prop img{transform-origin:50% 100%}
.prop img.paja-hop{animation:pajaHop .5s ease-out}@keyframes pajaHop{40%{transform:translateY(-5%) rotate(-2deg)}}
.prop img.paja-shake{animation:pajaShake .6s}@keyframes pajaShake{20%{transform:rotate(4deg)}40%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}80%{transform:rotate(-2deg)}}
.prop img.paja-snap{animation:pajaSnap .45s}@keyframes pajaSnap{25%{transform:rotate(-8deg) translateX(-2%)}}
.prop img.paja-note{position:absolute;left:46%;top:44%;width:22%;height:auto;transform:rotate(7deg);pointer-events:none;display:none;filter:drop-shadow(0 2px 3px rgba(60,40,20,.3))}
.paja-alert{position:absolute;left:50%;top:-7%;margin-left:-14px;width:28px;height:28px;border-radius:50%;background:#E9A93B;color:#fff;font:800 18px/28px "Segoe UI",system-ui,sans-serif;text-align:center;box-shadow:0 2px 8px rgba(80,50,20,.35);display:none;animation:bob 1.6s ease-in-out infinite}
.prop.has-order img.paja-note,.has-order .paja-alert{display:block}
#pajaBub{position:fixed;transform:translate(-50%,-100%);background:#F3E2B8;color:#4a3520;padding:8px 13px;border-radius:14px;border:2px solid #d9bf87;box-shadow:0 4px 14px rgba(50,30,20,.25);font:700 15px "Segoe Print","Comic Sans MS",cursive;max-width:300px;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:46}
#pajaBub.on{opacity:1}
#pajaBub::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;margin-left:-6px;background:#F3E2B8;border-right:2px solid #d9bf87;border-bottom:2px solid #d9bf87;transform:rotate(45deg)}
#pajaBub.edge{transform:translate(-100%,-50%)}#pajaBub.edge.left{transform:translate(0,-50%)}#pajaBub.edge::after{display:none}
#pajaCard{position:fixed;left:50%;top:70px;transform:translate(-50%,-8px);z-index:80;background:#fffaf6;color:#3b2f2a;border-radius:20px;box-shadow:0 10px 30px rgba(50,30,20,.3);padding:16px 20px 14px;width:min(340px,calc(100vw - 32px));box-sizing:border-box;font:14px "Segoe UI",system-ui,sans-serif;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#pajaCard.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#pajaCard h3{margin:0;font:700 19px "Segoe Print","Comic Sans MS",cursive;color:#6b4a33}
#pajaCard .sub{margin:2px 0 10px;color:#9a8478;font-size:13px}
#pajaCard .items{display:flex;gap:16px;justify-content:center;margin:6px 0}
#pajaCard .it{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px;color:#9a8478}#pajaCard .it img{width:38px;height:38px;object-fit:contain}#pajaCard .it.ok{color:#4f9a80}
#pajaCard .prize{text-align:center;margin:8px 0 4px}#pajaCard .hint{text-align:center;color:#9a8478;margin:4px 0;font-size:13px}
#pajaCard .give{display:block;margin:8px auto 2px;border:none;border-radius:16px;padding:9px 22px;background:#5FA88E;color:#fff;font:700 15px "Segoe UI",system-ui,sans-serif;cursor:pointer}
#pajaCard .x{position:absolute;right:10px;top:6px;border:none;background:none;font-size:24px;color:#9a8478;cursor:pointer}
#pajaCard .skins{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;border-top:1px solid #f0e2d6;padding-top:10px}#pajaCard .skins span{color:#9a8478;font-size:13px}
#pajaCard .skins button{border:1px solid #e8d8c8;background:#fff;border-radius:12px;padding:4px 10px;font:600 12px "Segoe UI",system-ui,sans-serif;color:#5a463d;cursor:pointer}#pajaCard .skins button.on{background:#E9A93B;border-color:#E9A93B;color:#fff}
.weed{position:absolute;z-index:9;cursor:grab;touch-action:none;transform-origin:50% 100%}.weed.gone{animation:pull 1s ease-out forwards;pointer-events:none}
.bird{position:absolute;z-index:9;cursor:pointer;animation:birdIn .6s ease-out}@keyframes birdIn{from{transform:translate(-60px,-80px);opacity:0}}
.bird.away{animation:birdAway 1.4s ease-in forwards;pointer-events:none}@keyframes birdAway{to{transform:translate(260px,-320px);opacity:0}}
.prop.shake{animation:treeShake .5s}@keyframes treeShake{25%{transform:rotate(1.6deg)}50%{transform:rotate(-1.4deg)}75%{transform:rotate(.8deg)}}
.treeLeaves{position:absolute;inset:0;pointer-events:none}.treeLeaves i{position:absolute;top:30%;width:10px;height:6px;border-radius:5px 1px;background:#7fb069;animation:leafDrop 1.8s ease-in forwards}@keyframes leafDrop{to{transform:translate(30px,220px) rotate(260deg);opacity:0}}
.apple{position:absolute;z-index:9;cursor:pointer;animation:appleFall .7s cubic-bezier(.5,0,.8,.6) forwards}@keyframes appleFall{to{transform:translateY(var(--fall))}}
.fly{position:absolute;z-index:36;pointer-events:none;opacity:0;animation:flyAway 3.8s ease-in-out forwards}
@keyframes flyAway{10%{opacity:1}30%{transform:translate(calc(var(--dx)*.3),calc(var(--dy)*.4)) rotate(-12deg) scaleX(.7)}55%{transform:translate(calc(var(--dx)*.6),calc(var(--dy)*.6)) rotate(10deg)}80%{opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(-8deg);opacity:0}}
body.night .deco-farolillos img{filter:drop-shadow(0 0 10px rgba(255,214,140,.9)) brightness(1.15)}
</style></head><body>
<div id="sky"></div><div id="sun"></div><div id="stars"></div><div id="clouds"></div>
<div class="layer" id="far"></div><div class="layer" id="mid"></div>
<div class="layer" id="ground"></div>
<div id="world"><div id="backL"></div><div id="ekoBox"></div><div id="frontL"></div></div>
<div id="interior" aria-label="Interior de la casa"><div id="houseView" aria-hidden="true"><img id="houseWindowSun" src="art/valley/sun.webp" alt=""><img class="houseWindowCloud" src="art/valley/cloud.webp" alt=""><div id="houseViewFar"></div><div id="houseViewMid"></div><div id="houseSeason"></div></div><img id="houseRoom" src="art/house-room.png" alt="" draggable="false"><div id="houseWallTint"></div><div id="houseFloorTint"></div><div id="houseProps"></div><button id="houseExit" aria-label="Salir al valle por la puerta"></button><button id="houseStairs" aria-label="Subir las escaleras"><span class="step"></span><span class="step"></span><span class="step"></span><span class="step"></span><span class="step"></span><span class="step"></span><span class="rail"></span><span class="landing"></span></button><div id="houseGallery" aria-label="Recuerdos y cuadros"></div><button id="houseGalleryClose" aria-label="Cerrar vitrina">×</button><div id="houseActors"></div></div>
<button id="back">← Volver</button><div id="title"></div><div id="cover"></div>
<div id="ekoTpl" style="display:none">
<!--SVG-->
</div>
<script src="world.js"></script>
</body></html>
