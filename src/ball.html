<!doctype html>
<html><head><meta charset="utf-8"><title>Eko · pelota</title>
<style>html,body{overflow:hidden}*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{margin:0;width:40px;height:40px;background:transparent;overflow:hidden;user-select:none}
#b{position:absolute;left:7px;top:7px;width:26px;height:26px;cursor:grab;touch-action:none}
#b:active{cursor:grabbing}
#b img{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));-webkit-user-drag:none;user-select:none}
</style></head>
<body>
<div id="b"><img src="art/ball.webp" alt="" draggable="false"></div>
<script>
// La pelota vive en su propia ventanita; Eko (ventana principal) decide dónde está.
// Aquí solo se dibuja (gira según lo que avanza) y se avisa de clics y arrastres.
(() => {
  const T = window.__TAURI__, b = document.getElementById("b");
  const send = (p) => T && T.event.emit("ball-in", p);
  const svg = b.firstElementChild;
  (function spin() { svg.style.transform = `rotate(${(window.screenX * 4.4) % 360}deg)`; requestAnimationFrame(spin); })();
  b.addEventListener("pointerdown", (e) => { if (e.button !== 0) return; b.setPointerCapture(e.pointerId); send({ t: "down", x: e.screenX, y: e.screenY }); });
  b.addEventListener("pointermove", (e) => { if (b.hasPointerCapture(e.pointerId)) send({ t: "move", x: e.screenX, y: e.screenY }); });
  b.addEventListener("pointerup", (e) => { if (b.hasPointerCapture(e.pointerId)) send({ t: "up", x: e.screenX, y: e.screenY }); });
  b.addEventListener("dblclick", () => send({ t: "stow" }));
  addEventListener("contextmenu", (e) => { e.preventDefault(); send({ t: "stow" }); });
})();
</script>
</body></html>
