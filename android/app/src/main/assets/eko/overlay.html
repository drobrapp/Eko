#eko{position:absolute;left:0;right:0;bottom:0;top:0;pointer-events:none}
#eko #mochi{position:absolute;left:50%;bottom:4px;height:141px;width:auto;transform:translateX(-50%);overflow:visible}
#fx{position:absolute;inset:0;pointer-events:none}
#fx .fx{position:absolute;font:700 20px system-ui,sans-serif;transform:translate(-50%,-50%);animation:fxup 1.3s ease-out forwards;text-shadow:0 1px 2px rgba(255,255,255,.8)}

#z{position:absolute;right:16%;top:30%;font:700 22px "Segoe Print","Comic Sans MS",cursive;color:#7f6bb8;opacity:0;transition:opacity .5s}
#eko[data-state="sleep"] #z{opacity:1;animation:zz 2.4s ease-in-out infinite}
@keyframes zz{50%{transform:translate(4px,-8px)}}
