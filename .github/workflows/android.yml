name: Eko Android

on:
  push:
    branches: [main]
    paths: ['android/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle -p android assembleRelease

      # Se publica como «prerelease» para no tocar las actualizaciones de Windows
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Eko Android (prueba ${{ github.run_number }})
          files: android/app/build/outputs/apk/release/app-release.apk
          prerelease: true
          make_latest: false
          body: APK de prueba de Eko para Android. Ábrelo desde el móvil e instálalo.
