<!doctype html>
<html><head><meta charset="utf-8"><title>Eko · casa</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
#room{position:absolute;left:0;right:0;bottom:0;opacity:0;transform:scale(.6) translateY(30px);transform-origin:50% 100%;transition:filter 2s ease}
#room.on{opacity:1;transform:none}
#room.appear{animation:roomIn .7s cubic-bezier(.3,1.5,.5,1) forwards}
#room.vanish{animation:roomOut .5s ease-in forwards}
@keyframes roomIn{0%{opacity:0;transform:scale(.6) translateY(30px)}60%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:none}}
#room.build{opacity:1;transform:none}
#room.build #inner{animation:rise 1.6s cubic-bezier(.3,1.2,.5,1) forwards}
@keyframes rise{0%{clip-path:inset(100% 0 0 0);transform:translateY(12px)}30%{clip-path:inset(74% 0 0 0);transform:none}55%{clip-path:inset(30% 0 0 0)}100%{clip-path:inset(0 0 0 0)}}
@keyframes roomOut{0%{opacity:1;transform:none}100%{opacity:0;transform:scale(.7) translateY(20px)}}
#inner{position:absolute;inset:0;transition:filter 2s}
.bg{position:absolute;left:0;bottom:0;width:100%;pointer-events:none;user-select:none}
#sky{position:absolute;border-radius:4px;overflow:hidden;transition:background 2s ease}
#sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:#FFF4E8;opacity:0;transition:opacity 2s}
#sky.night i{opacity:.9}

#sky.leaves b{width:5px;height:3px;border-radius:2px;background:#D0795A;animation-duration:2.4s}
@keyframes flake{to{transform:translate(8px,56px) rotate(160deg)}}
.d{position:absolute;user-select:none;pointer-events:none}
.d img{width:100%;height:100%;display:block;transform-origin:50% 100%}
.d.wall img{transform-origin:50% 0%;filter:drop-shadow(0 3px 3px rgba(60,35,20,.28))}
.d.floor::after{content:"";position:absolute;left:8%;right:8%;bottom:-3px;height:9px;border-radius:50%;background:radial-gradient(closest-side,rgba(70,40,20,.38),transparent);z-index:-1}
.cloud{position:absolute;border-radius:50%;background:#FFF8EF;box-shadow:inset -6px -8px 0 rgba(200,180,165,.35);pointer-events:none;animation:cl 1s ease-out forwards}
@keyframes cl{0%{transform:scale(.2);opacity:0}25%{opacity:1}100%{transform:scale(1.25) translateY(-12px);opacity:0}}
.d.flat img{filter:drop-shadow(0 1px 1px rgba(60,35,20,.18))}
.d.lamp::before{content:"";position:absolute;left:-160%;top:-55%;width:420%;height:110%;background:radial-gradient(closest-side,rgba(255,206,130,.45),rgba(255,206,130,.12) 55%,transparent);opacity:0;transition:opacity 1.2s;pointer-events:none}
.d.lamp.lit::before{opacity:1}
.d.lamp.lit img{filter:brightness(1.08) drop-shadow(0 0 6px rgba(255,200,120,.7))}
.sp{position:absolute;width:14px;height:14px;pointer-events:none;animation:sp .8s ease-out forwards}
@keyframes sp{0%{transform:scale(.3);opacity:0}30%{opacity:1}100%{transform:scale(1.1) translateY(-14px);opacity:0}}
@keyframes wig{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg) scaleY(.96)}45%{transform:rotate(4deg)}70%{transform:rotate(-2deg)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-6px) scale(1.04,.97)}60%{transform:translateY(0) scale(.97,1.03)}}
@keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes gone{to{transform:scale(.2);opacity:0}}
@keyframes land{0%{transform:scaleY(.8) scaleX(1.15)}50%{transform:scaleY(1.06) scaleX(.96)}100%{transform:none}}
#parcel{position:absolute;pointer-events:none;display:none}
#parcel .box{position:absolute;inset:0;width:100%;height:100%}
#parcel .bal{position:absolute;width:34px;left:50%;margin-left:-17px;bottom:92%;transition:opacity .4s}
#parcel.drop{display:block;animation:fall 2.2s cubic-bezier(.35,.1,.4,1) forwards}
#parcel.floor,#parcel.open{display:block}
#parcel.floor .bal,#parcel.open .bal{opacity:0}
#parcel.open .box{animation:wig .5s ease}
@keyframes fall{0%{transform:translateY(-220px) rotate(-6deg)}50%{transform:translateY(-90px) rotate(5deg)}80%{transform:translateY(-12px) rotate(-2deg)}100%{transform:none}}
#wallT{position:absolute;left:0;width:100%;pointer-events:none;mix-blend-mode:multiply;-webkit-mask-image:url(art/room-wallmask.webp);mask-image:url(art/room-wallmask.webp);-webkit-mask-size:100% 100%;mask-size:100% 100%}
#tools{position:absolute;left:6px;right:6px;top:6px;height:44px;display:none;align-items:center;gap:6px;padding:0 6px 0 10px;border-radius:16px;background:#fffaf6;box-shadow:0 4px 14px rgba(50,30,20,.3);font:600 12px "Segoe UI",system-ui,sans-serif;color:#3b2f2a;z-index:50}
body.edit #tools{display:flex}
#tName{white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis}
#sw{flex:1;display:flex;gap:5px;overflow:hidden;align-items:center}
#sw i{font:400 10.5px "Segoe UI",system-ui,sans-serif;color:#8a7468;font-style:normal;white-space:nowrap}
.swc{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #e3d2c7;padding:0;cursor:pointer;flex:none;display:grid;place-items:center;overflow:hidden;background:#f6ece4;position:relative}
.swc img{width:20px;height:20px;object-fit:contain}
.swc.on{box-shadow:0 0 0 2px #D0795A}
.swc.lock{opacity:.45}
.swc.lock::after{content:"🔒";position:absolute;font-size:9px;right:-2px;bottom:-3px}
#tools button:not(.swc){border:none;border-radius:12px;background:#efe3da;color:#6b5348;font:700 13px "Segoe UI",system-ui,sans-serif;height:28px;min-width:28px;padding:0 8px;cursor:pointer}
#tools #tDone{background:#6b5348;color:#fff}
body.edit .d{pointer-events:auto;cursor:grab}
body.edit .d.fixed{cursor:default}
body.edit .d.drag{cursor:grabbing}
.d.shake{animation:shake .35s ease}
@keyframes shake{25%{translate:-4px 0}75%{translate:4px 0}}
</style></head><body>
<div id="tools"><b id="tName">Decorar</b><div id="sw"></div><button id="tUndo" title="Deshacer">↶</button><button id="tReset" title="Restablecer">⟲</button><button id="tDone">Listo</button></div><div id="room"><div id="inner"><img class="bg" id="bg" alt="" draggable="false"><div id="wallT"></div><img class="bg" id="floorL" src="art/room-floor.webp" alt="" draggable="false"><div id="sky"></div><div id="layer"></div><div id="parcel"><img class="bal" src="art/balloon.webp" alt=""><img class="box" src="art/parcel.webp" alt=""></div></div></div>
<script>
// Casa de Eko: aparece entre nubes, ventana según la hora, muebles con perspectiva y los efectos de colocar/guardar.
(() => {
  const T = window.__TAURI__; if (!T) return;
  const $ = (s) => document.querySelector(s);
  const room = $("#room"), sky = $("#sky"), layer = $("#layer"), parcel = $("#parcel");
  const els = {}; let tilt = 0, shelfEl = null, top = 60;
  for (let i = 0; i < 7; i++) { const s = document.createElement("i"); s.style.left = (8 + Math.random() * 84) + "%"; s.style.top = (8 + Math.random() * 70) + "%"; sky.appendChild(s); }
  const SKY = { day: "linear-gradient(#9CC9EE,#CFE6F7)", dawn: "linear-gradient(#F6C59B,#CFE0EE)", dusk: "linear-gradient(#5C5C9E,#F3A58A)", night: "linear-gradient(#1E2650,#34406B)" };
  T.event.listen("corner-layout", (e) => {
    const p = e.payload || {}; tilt = p.tilt || 0; top = p.top || 60;
    room.style.top = "0px";
    const bg = $("#bg"); if (bg.getAttribute("src") !== p.room) bg.src = p.room;
    bg.style.top = top + "px"; bg.style.height = "auto";
    const fl = $("#floorL"); fl.style.top = top + "px"; fl.style.filter = p.floorF || "";
    const wt = $("#wallT"); wt.style.top = top + "px"; wt.style.height = (bg.offsetHeight || 205) + "px"; wt.style.background = p.wallC || "transparent";
    last = {};
    const g = p.glass; Object.assign(sky.style, { left: g.x + "px", top: g.y + "px", width: g.w + "px", height: g.h + "px", background: SKY[p.sky] || SKY.day });
    sky.className = p.sky + (p.weather ? " " + p.weather : "");
    if (p.weather !== sky.dataset.w) { sky.dataset.w = p.weather || ""; sky.querySelectorAll("b").forEach((b) => b.remove()); if (p.weather) for (let i = 0; i < 8; i++) { const b = document.createElement("b"); b.style.left = Math.random() * 100 + "%"; b.style.animationDelay = (-Math.random() * 3) + "s"; if (p.weather === "leaves") b.style.background = ["#D0795A", "#E9A93B", "#C9A27A"][i % 3]; sky.appendChild(b); } }   // solo cambia el cielo; la habitación tiene siempre la misma luz
    if (p.shelf) {
      if (!shelfEl) { shelfEl = document.createElement("img"); shelfEl.className = "d"; shelfEl.draggable = false; layer.appendChild(shelfEl); }
      shelfEl.src = p.shelf.src; Object.assign(shelfEl.style, { left: p.shelf.x + "px", top: p.shelf.y + "px", width: p.shelf.w + "px", height: p.shelf.h + "px", zIndex: 1, filter: "drop-shadow(0 3px 3px rgba(60,35,20,.25))" });
    } else if (shelfEl) { shelfEl.remove(); shelfEl = null; }
    const keep = new Set();
    for (const it of p.items || []) {
      keep.add(it.id); last[it.id] = it;
      let el = els[it.id];
      if (!el) { el = els[it.id] = document.createElement("div"); el.innerHTML = '<img alt="" draggable="false">'; layer.appendChild(el); }
      const wall = it.id === "frame" || it.id === "pic1" || it.id === "pic2" || it.id === "curtains";
      el.className = "d " + (it.id === "rug" ? "flat" : wall ? "wall" : "floor") + (it.id === "lamp" ? " lamp" + (p.lampOn ? " lit" : "") : "");
      const img = el.firstChild;
      if (img.getAttribute("src") !== it.src) img.src = it.src;
      if (drag && drag.id === it.id) continue;
      Object.assign(el.style, { left: it.x + "px", top: it.y + "px", width: it.w + "px", height: it.h + "px", zIndex: it.id === "rug" ? 1 : it.z >= 1 ? 2 : 3 + Math.round((1 - it.z) * 100) });
      el.dataset.id = it.id; el.classList.toggle("fixed", !it.move); el.classList.toggle("sel", sel === it.id);
      img.style.filter = (it.f || "") + (it.id === "lamp" && p.lampOn ? " brightness(1.08) drop-shadow(0 0 6px rgba(255,200,120,.7))" : "") + (sel === it.id ? " drop-shadow(0 0 2px #fff) drop-shadow(0 0 3px #D0795A)" : "");
      if (it.id === "frame" && !el.dataset.anim) img.style.transform = `rotate(${tilt}deg)`;
    }
    for (const id in els) if (!keep.has(id) && !els[id].dataset.leaving) { els[id].remove(); delete els[id]; }
    if (mode) { mode.sel = mode.sel || {}; tools(); }
    const pc = p.parcel;
    if (pc) {
      Object.assign(parcel.style, { left: pc.x + "px", top: pc.y + "px", width: pc.w + "px", height: pc.h + "px", zIndex: 8 });
      if (!parcel.classList.contains(pc.state)) parcel.className = pc.state;
    } else if (!parcel.dataset.leaving) parcel.className = "";
  });
  // ---------- Modo decorar ----------
  let mode = null, sel = null, drag = null, last = {};
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const depth = (b) => clamp((184 - b) / 38, 0, 1), persp = (z) => 1 - 0.22 * z;
  const emit = (n, p) => T.event.emit(n, p || {});
  T.event.listen("corner-mode", (e) => {
    const p = e.payload || {};
    if (!p.on) { mode = null; sel = null; document.body.classList.remove("edit"); for (const id in els) els[id].classList.remove("sel"); return; }
    mode = p; document.body.classList.add("edit"); tools();
  });
  $("#tDone").onclick = () => emit("corner-done");
  $("#tUndo").onclick = () => emit("corner-undo");
  $("#tReset").onclick = () => emit("corner-reset");
  addEventListener("keydown", (e) => { if (mode && e.key === "Escape") emit("corner-done"); });
  const NAME = { bed: "Camita", pot: "Maceta", rug: "Alfombra", curtains: "Cortinas", lamp: "Lamparita", cabinet: "Vitrina", frame: "Cuadro", pic1: "Cuadro", pic2: "Cuadro", season: "Calabaza", trophy: "Trofeo" };
  function tools() {
    if (!mode) return;
    const sw = $("#sw"); sw.innerHTML = "";
    const it = sel && last[sel];
    const btn = (html, on, lock, fn, title) => { const b = document.createElement("button"); b.className = "swc" + (on ? " on" : "") + (lock ? " lock" : ""); b.innerHTML = html; b.title = title || ""; b.onclick = (ev) => { ev.stopPropagation(); fn(); }; sw.appendChild(b); };
    if (it) {
      $("#tName").textContent = NAME[sel] || "Objeto";
      const cs = mode.colors[sel];
      if (cs) cs.forEach((c, i) => btn(`<img src="${it.src}" style="filter:${c.f}">`, (it.color || 0) === i, c.locked, () => (c.locked ? emit("corner-locked", { lv: c.lv }) : emit("corner-edit", { id: sel, color: i })), c.n + (c.locked ? " · Nivel " + c.lv : "")));
      else sw.innerHTML = it.move ? "<i>Arrástralo para moverlo</i>" : "<i>Este no se mueve</i>";
    } else {
      $("#tName").textContent = "Pared y suelo";
      mode.walls.forEach((w, i) => btn("", mode.sel.wallC === i, w.locked, () => (w.locked ? emit("corner-locked", { lv: w.lv }) : (mode.sel.wallC = i, emit("corner-edit", { wallC: i }), tools())), w.n + (w.locked ? " · Nivel " + w.lv : "")));
      [...sw.children].forEach((b, i) => (b.style.background = mode.walls[i].c || "#FFF4E8"));
      mode.floors.forEach((f, i) => btn(`<img src="art/room-floor.webp" style="width:60px;height:30px;object-fit:cover;object-position:50% 80%;filter:${f.f}">`, mode.sel.floorC === i, false, () => { mode.sel.floorC = i; emit("corner-edit", { floorC: i }); tools(); }, "Suelo: " + f.n));
    }
  }
  function select(id) { sel = id; for (const k in els) els[k].classList.toggle("sel", k === id); tools(); }
  document.addEventListener("pointerdown", (e) => {
    if (!mode) return;
    if (e.target.closest("#tools")) return;
    const el = e.target.closest(".d"); const id = el && el.dataset.id;
    if (!id) { select(null); return; }
    const it = last[id]; if (!it) return;
    select(it.id.startsWith("sv:") || (it.id === "trophy" && !it.move) ? "cabinet" : id);
    if (!it.move) return;
    drag = { id, el, it, sx: e.clientX, sy: e.clientY, moved: false, w0: it.w / (it.s || 1), h0: it.h / (it.s || 1), b0: it.base ? it.base.b0 : null };
    el.setPointerCapture(e.pointerId); el.classList.add("drag");
    if (id === "cabinet") for (const k in els) if (k.startsWith("sv:") || k === "trophy") els[k].style.opacity = "0";
  });
  document.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    const it = drag.it, el = drag.el;
    if (it.wall) {
      const t = clamp(it.t + dy, mode.wall.t0, mode.wall.t1 - it.h), cx = clamp(it.cx + dx, mode.wall.x0 + it.w / 2, mode.wall.x1 - it.w / 2);
      drag.cx = cx; drag.t = t;
      Object.assign(el.style, { left: cx - it.w / 2 + "px", top: mode.top + t + "px" });
    } else {
      const b = clamp(it.b + dy, mode.floor.b0, mode.floor.b1);
      const s = it.flat ? 1 : persp(depth(b)) / persp(depth(drag.b0 != null ? drag.b0 : b));
      const w = drag.w0 * s, h = drag.h0 * s, cx = clamp(it.cx + dx, mode.floor.x0 + w / 2, mode.floor.x1 - w / 2);
      drag.cx = cx; drag.b = b; drag.box = { x: cx - w / 2, y: mode.top + b - h, w, h };
      Object.assign(el.style, { left: drag.box.x + "px", top: drag.box.y + "px", width: w + "px", height: h + "px", zIndex: it.flat ? 1 : 3 + Math.round(depth(b) < 1 ? (1 - depth(b)) * 100 : 0) });
    }
  });
  const inter = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
  document.addEventListener("pointerup", () => {
    if (!drag) return;
    const d = drag; drag = null; d.el.classList.remove("drag");
    for (const k in els) if (k.startsWith("sv:") || k === "trophy") els[k].style.opacity = "";
    if (!d.moved) return;
    const it = d.it;
    const box = it.wall ? { x: d.cx - it.w / 2, y: mode.top + d.t, w: it.w, h: it.h } : d.box;
    // que no se amontonen: si pisa mucho a otro, vuelve a su sitio
    const others = Object.values(last).filter((o) => o.id !== it.id && !o.id.startsWith("sv:") && o.id !== "trophy" && !o.flat && !!o.wall === !!it.wall);
    if (it.wall) others.push({ x: mode.window.x, y: mode.window.y, w: mode.window.w, h: mode.window.h });
    const bad = !it.flat && others.some((o) => inter(box, o) > 0.3 * Math.min(box.w * box.h, o.w * o.h));
    if (bad) { Object.assign(d.el.style, { left: it.x + "px", top: it.y + "px", width: it.w + "px", height: it.h + "px" }); d.el.classList.remove("shake"); void d.el.offsetWidth; d.el.classList.add("shake"); return; }
    emit("corner-edit", it.wall ? { id: it.id, cx: d.cx, t: d.t } : { id: it.id, cx: d.cx, b: d.b });
  });
  function clouds(x, y, w, h, n) {
    for (let i = 0; i < n; i++) setTimeout(() => {
      const c = document.createElement("div"); c.className = "cloud";
      const s = 22 + Math.random() * 30; c.style.width = s + "px"; c.style.height = s * 0.8 + "px";
      c.style.left = x + Math.random() * w - s / 2 + "px"; c.style.top = y + Math.random() * h - s / 2 + "px";
      document.body.appendChild(c); setTimeout(() => c.remove(), 1100);
    }, i * 40);
  }
  function sparkles(el, n) {
    const r = el.getBoundingClientRect();
    for (let i = 0; i < n; i++) setTimeout(() => {
      const s = document.createElement("img"); s.src = "art/fx-spark.webp"; s.className = "sp";
      s.style.left = r.left + Math.random() * (r.width - 14) + "px"; s.style.top = r.top + Math.random() * r.height * 0.6 + "px";

  const puffAt = (el, n = 8) => { const r = el.getBoundingClientRect(); clouds(r.left, r.top, r.width, r.height, n); };
  T.event.listen("corner-fx", (e) => {
    const { id, kind } = e.payload || {};
    if (id === "room") {

      if (kind === "build") {
        room.className = room.className.replace(/\b(on|appear|vanish|build)\b/g, "") + " build";
        clouds(10, innerHeight - 60, innerWidth - 20, 50, 14);
        setTimeout(() => clouds(10, top + 60, innerWidth - 20, innerHeight - top - 80, 16), 600);
        setTimeout(() => { clouds(10, top, innerWidth - 20, innerHeight - top, 22); const b = document.body.getBoundingClientRect(); for (let i = 0; i < 14; i++) setTimeout(() => { const sp = document.createElement("img"); sp.src = "art/fx-spark.webp"; sp.className = "sp"; sp.style.left = Math.random() * (b.width - 14) + "px"; sp.style.top = top + Math.random() * (b.height - top - 20) + "px"; document.body.appendChild(sp); setTimeout(() => sp.remove(), 900); }, i * 70); }, 1400);
        setTimeout(() => { room.classList.remove("build"); room.classList.add("on"); }, 1700);
      }
      if (kind === "vanish") { clouds(10, top + 20, innerWidth - 20, innerHeight - top - 30, 16); room.classList.remove("on"); room.classList.add("vanish"); }
      return;
    }
    if (id === "parcel") {
      if (kind === "land") { anim(parcel.querySelector(".box"), "land .4s ease"); puffAt(parcel, 5); }
      if (kind === "open") sparkles(parcel, 6);
      if (kind === "gone") { parcel.dataset.leaving = 1; parcel.className = "open"; puffAt(parcel, 7); anim(parcel.querySelector(".box"), "gone .3s ease forwards"); setTimeout(() => { delete parcel.dataset.leaving; parcel.className = ""; parcel.querySelector(".box").style.animation = ""; }, 350); }
      return;
    }
    const el = els[id]; if (!el) return;
    const img = el.firstChild;
    if (kind === "water") anim(img, "wig .7s ease");
    if (kind === "happy") { anim(img, "hop .6s ease"); sparkles(el, 4); }
    if (kind === "shine") sparkles(el, 6);
    if (kind === "appear") { el.dataset.anim = 1; puffAt(el, 9); anim(img, "pop .5s cubic-bezier(.3,1.5,.5,1) forwards"); setTimeout(() => { delete el.dataset.anim; img.style.animation = ""; img.style.transform = id === "frame" ? `rotate(${tilt}deg)` : ""; }, 550); sparkles(el, 4); }
    if (kind === "vanish") { el.dataset.leaving = 1; puffAt(el, 9); anim(img, "gone .3s ease forwards"); setTimeout(() => { el.remove(); delete els[id]; }, 320); }
    if (kind === "fix") {
      el.dataset.anim = 1; img.style.animation = "none"; const a0 = tilt, t0 = performance.now();
      const step = (now) => { const t = (now - t0) / 1000, a = a0 * Math.exp(-4 * t) * Math.cos(t * 14); img.style.transform = `rotate(${a.toFixed(2)}deg)`;
        if (t < 1.4) requestAnimationFrame(step); else { img.style.transform = "rotate(0deg)"; delete el.dataset.anim; tilt = 0; } };
      requestAnimationFrame(step); sparkles(el, 3);
    }
  });
})();
</script>
