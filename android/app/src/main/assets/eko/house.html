<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  /* Casa de Eko en el móvil: pantalla fija tipo Tamagotchi.
     Fondo: la propia habitación desenfocada; centro: la habitación nítida (art/casa-vertical.webp, de Aitor);
     arriba una tarjeta con sus necesidades y abajo una barra flotante. Iconos: arte de arcilla del PC (art/ui).
     Las barras del sistema se respetan con --top / --bottom, que pone Android. */
  :root { --ink: #4E3B33; --ink2: #8A7266; --cream: #FFF7EE; --glass: rgba(255, 247, 238, .78); --line: rgba(255, 255, 255, .7);
          --top: 24px; --bottom: 16px; --shadow: 0 10px 30px rgba(74, 44, 24, .18), 0 2px 6px rgba(74, 44, 24, .12); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d99a63; color: var(--ink);
               font-family: "Google Sans", "Product Sans", Roboto, system-ui, sans-serif; letter-spacing: .01em; }

  /* Fondo: la habitación ampliada y desenfocada, para que no haya franjas de color plano */
  #backdrop { position: fixed; inset: -40px; background: url(art/casa-vertical.webp) center / cover no-repeat; filter: blur(26px) saturate(1.05) brightness(.92); transform: scale(1.08); }
  #shade { position: fixed; inset: 0; background: linear-gradient(rgba(60,34,18,.18), transparent 22%, transparent 78%, rgba(60,34,18,.22)); pointer-events: none; }

  #room { position: absolute; left: 0; top: 0; width: 1024px; height: 1536px; transform-origin: 0 0;
          -webkit-mask-image: linear-gradient(transparent 0, #000 4%, #000 95%, transparent 100%); mask-image: linear-gradient(transparent 0, #000 4%, #000 95%, transparent 100%); }
  #room > * { position: absolute; }

  /* Lo que se ve por la ventana (detrás de la habitación) */
  #sky { left: 388px; top: 392px; width: 250px; height: 314px; overflow: hidden; background: linear-gradient(#8fc2ec, #d3ebf8); transition: background 3s; }
  #sky img { position: absolute; pointer-events: none; }
  #sun { left: 60%; top: 8%; width: 32%; filter: drop-shadow(0 0 10px rgba(255,214,120,.6)); animation: bob 60s ease-in-out infinite; }
  #moon { left: 58%; top: 10%; width: 28%; display: none; filter: drop-shadow(0 0 8px rgba(255,250,220,.5)); }
  .cloud { width: 50%; opacity: .9; animation: drift 40s ease-in-out infinite alternate; }
  #far, #mid { position: absolute; left: -10%; right: -10%; bottom: 0; background-repeat: repeat-x; background-position: center bottom; background-size: auto 100%; }
  #far { bottom: 14%; height: 34%; background-image: url(art/valley/hills-far.webp); opacity: .85; }
  #mid { height: 30%; background-image: url(art/valley/hills-mid.webp); }
  #stars { position: absolute; inset: 0; display: none; background-image: radial-gradient(2px 2px at 20% 20%, #fff, transparent), radial-gradient(2px 2px at 70% 35%, #fff, transparent), radial-gradient(1.5px 1.5px at 40% 12%, #fff, transparent), radial-gradient(1.5px 1.5px at 85% 15%, #fff, transparent), radial-gradient(2px 2px at 30% 45%, #fff, transparent); }
  body.night #stars, body.night #moon { display: block; }
  body.night #sun, body.night .cloud { display: none; }
  body.night #far, body.night #mid { filter: brightness(.45) saturate(.7); }
  body.gold #far, body.gold #mid { filter: sepia(.35) saturate(1.2); }
  body.night #backdrop { filter: blur(26px) brightness(.55) saturate(.8); }
  @keyframes bob { 50% { transform: translate(-6px, 6px); } }
  @keyframes drift { to { transform: translateX(30px); } }

  #photo { left: 818px; top: 597px; width: 67px; height: 86px; background: #F3DCC6 center / cover no-repeat; }
  #bg { left: 0; top: 0; width: 1024px; height: 1536px; pointer-events: none; }
  .find { position: absolute; font-size: 46px; line-height: 1; transform: translateX(-50%); filter: drop-shadow(0 2px 2px rgba(90,70,61,.3)); pointer-events: none; }
  #libreta { left: 508px; top: 858px; width: 92px; transform: rotate(-8deg); filter: drop-shadow(0 4px 4px rgba(70,45,25,.25)); pointer-events: none; }

  #night { left: 0; top: 0; width: 1024px; height: 1536px; pointer-events: none; mix-blend-mode: multiply; background: rgba(40,48,96,.6); opacity: 0; transition: opacity 2s; }
  #glow { left: 0; top: 0; width: 1024px; height: 1536px; pointer-events: none; mix-blend-mode: screen; opacity: 0; transition: opacity .6s; }
  #glow i { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); background: radial-gradient(closest-side, rgba(255,205,130,.75), rgba(255,190,110,.25) 55%, transparent); }

  .spot { position: absolute; border-radius: 26px; transition: background .15s; }
  .spot:active { background: rgba(255,247,238,.22); }

  /* Sombra de Eko: se queda en el suelo (o en el sillón) y encoge cuanto más alto está */
  #shadowF { left: 0; top: 0; width: 100px; height: 24px; border-radius: 50%; pointer-events: none; transform-origin: 50% 50%;
             background: radial-gradient(closest-side, rgba(70,40,20,.55), rgba(70,40,20,.25) 60%, transparent); }
  /* Parte delantera del sillón (brazos y frente del asiento), recortada de la misma imagen: tapa a Eko cuando se sienta */
  #fg { left: 0; top: 0; width: 1024px; height: 1536px; pointer-events: none; display: none;
        clip-path: polygon(605px 890px, 610px 865px, 620px 845px, 640px 835px, 670px 833px, 688px 840px, 696px 858px, 688px 890px, 666px 915px, 660px 958px, 720px 962px, 773px 958px, 772px 905px, 780px 882px, 800px 872px, 822px 875px, 838px 892px, 846px 935px, 850px 1000px, 828px 1032px, 788px 1036px, 720px 1010px, 660px 1002px, 618px 992px, 605px 950px); }
  #eko { left: 0; top: 0; width: 160px; height: 250px; border: 0; background: transparent; pointer-events: none; transform-origin: 50% 100%; }
  #ekoHit { width: 300px; height: 400px; border-radius: 40%; touch-action: none; }
  #ekoHit:active { background: transparent; }

  /* Bocadillo de Eko */
  /* Bocadillo: idéntico al de Eko en tu pantalla (el de Android): misma letra, tamaño, colores, borde y esquinas.
     Va fuera de la habitación (en píxeles de pantalla) para que mida exactamente lo mismo. */
  #bub { position: fixed; left: 0; top: 0; z-index: 9; width: max-content; max-width: 220px; padding: 8px 13px; border-radius: 18px;
         background: #FFFAF6; border: 1px solid #E8D8C8; color: #3B2F2A; font: 400 14px/1.32 Roboto, "Noto Sans", sans-serif; letter-spacing: 0;
         transform: translate(-50%, -100%); opacity: 0; transition: opacity .18s; pointer-events: none; }
  #bub.on { opacity: 1; }

  /* ---------- Tarjeta de arriba ---------- */
  .glass { background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2);
           border: 1px solid var(--line); box-shadow: var(--shadow); }
  #hud { position: fixed; left: 14px; right: 14px; top: calc(var(--top) + 10px); border-radius: 26px; padding: 12px 14px 14px; z-index: 10; }
  #hudTop { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  #name { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  #day { font-size: 13px; color: var(--ink2); font-weight: 500; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.55); }
  #gear { margin-left: auto; width: 38px; height: 38px; border: 0; border-radius: 50%; background: rgba(255,255,255,.55); display: grid; place-items: center; padding: 0; }
  #gear img { width: 26px; height: 26px; }
  #needs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .need { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .need img { width: 28px; height: 28px; object-fit: contain; flex: none; filter: drop-shadow(0 1px 1px rgba(74,44,24,.2)); }
  .bar { flex: 1; height: 8px; border-radius: 999px; background: rgba(78,59,51,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: calc(var(--v, 50) * 1%); border-radius: inherit; background: var(--c); transition: width .6s ease; }
  .need.low .bar i { animation: low 1.1s ease-in-out infinite; }
  @keyframes low { 50% { opacity: .45; } }

  /* ---------- Barra de abajo ---------- */
  #dock { position: fixed; left: 12px; right: 12px; bottom: calc(var(--bottom) + 10px); border-radius: 28px; padding: 8px 6px; display: grid; grid-template-columns: repeat(6, 1fr); z-index: 10; }
  #dock button { border: 0; background: transparent; color: var(--ink); font: 600 11px/1.1 inherit; padding: 6px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; border-radius: 20px; transition: transform .12s, background .12s; }
  #dock button:active { transform: scale(.9); background: rgba(255,255,255,.5); }
  #dock img { width: 38px; height: 38px; object-fit: contain; filter: drop-shadow(0 2px 2px rgba(74,44,24,.18)); }

  /* ---------- Hoja de ropa ---------- */
  #ward { position: fixed; left: 0; right: 0; bottom: 0; border-radius: 30px 30px 0 0; padding: 10px 16px calc(var(--bottom) + 18px); z-index: 20;
          transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.9,.3,1); }
  #ward.on { transform: none; }
  #ward .handle { width: 40px; height: 5px; border-radius: 3px; background: rgba(78,59,51,.2); margin: 0 auto 12px; }
  #ward h3 { margin: 0 4px 12px; font-size: 18px; font-weight: 700; }
  #ward .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  #ward button { border: 0; background: rgba(255,255,255,.6); border-radius: 18px; padding: 10px 2px 8px; font: 500 12px/1.1 inherit; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #ward button.cur { background: #fff; box-shadow: inset 0 0 0 2px #E9A93B; }
  #ward button span { font-size: 30px; line-height: 44px; height: 44px; }
  #ward button img { width: 44px; height: 44px; object-fit: contain; }
  /* ---------- Hojas (Paseos, Colección) ---------- */
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 84vh; overflow-y: auto; border-radius: 30px 30px 0 0; padding: 10px 18px calc(var(--bottom) + 20px); z-index: 20;
           transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.9,.3,1); }
  #sheet.on { transform: none; }
  #sheet .handle { width: 40px; height: 5px; border-radius: 3px; background: rgba(78,59,51,.2); margin: 0 auto 12px; }
  #sheet h3 { margin: 0 2px 4px; font-size: 20px; font-weight: 700; }
  #sheet .sub { margin: 0 2px 14px; font-size: 13px; color: var(--ink2); }
  .card { background: rgba(255,255,255,.62); border-radius: 20px; padding: 14px; margin-bottom: 10px; }
  .hero { display: flex; align-items: center; gap: 16px; }
  .ring { width: 104px; height: 104px; border-radius: 50%; flex: none; display: grid; place-items: center; position: relative;
          background: conic-gradient(#5FA88E calc(var(--p) * 1%), rgba(78,59,51,.1) 0); }
  .ring::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: #fffaf4; }
  .ring div { position: relative; text-align: center; line-height: 1.05; }
  .ring b { font-size: 22px; } .ring small { display: block; font-size: 11px; color: var(--ink2); }
  .hero .t { font-size: 15px; line-height: 1.4; } .hero .t b { font-size: 17px; }
  .bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 120px; position: relative; padding-top: 14px; }
  .bars .goal { position: absolute; left: 0; right: 0; border-top: 2px dashed rgba(208,121,90,.7); }
  .bar2 { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; font-size: 11px; color: var(--ink2); }
  .bar2 i { width: 70%; border-radius: 8px 8px 4px 4px; background: #C9A27A; min-height: 4px; }
  .bar2.ok i { background: #5FA88E; } .bar2.today i { background: #E9A93B; } .bar2.today.ok i { background: #5FA88E; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #5FA88E; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: rgba(255,255,255,.7); border-radius: 999px; padding: 7px 12px; font-size: 13px; }
  .chip b { font-weight: 700; }
  .row2 { display: flex; align-items: center; gap: 12px; }
  .row2 img { width: 40px; height: 40px; }
  .row2 .t { flex: 1; font-size: 14px; line-height: 1.35; }
  .pill { border: 0; border-radius: 999px; background: #D0795A; color: #fff; font: 700 14px/1 inherit; padding: 11px 16px; }
  .pill.soft { background: rgba(78,59,51,.08); color: var(--ink); }
  .cities { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .cities button { border: 0; border-radius: 14px; background: rgba(255,255,255,.7); padding: 11px; font: 500 14px/1.1 inherit; color: var(--ink); text-align: left; }
  .cities button.cur { box-shadow: inset 0 0 0 2px #E9A93B; background: #fff; }
  .more { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .more button { border: 0; border-radius: 20px; background: rgba(255,255,255,.66); padding: 16px 4px 12px; font: 600 13px/1.1 inherit; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .more button:active { transform: scale(.95); background: #fff; }
  .more img { width: 44px; height: 44px; object-fit: contain; } .more span { font-size: 34px; line-height: 44px; }
  .finds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .fd { background: rgba(255,255,255,.66); border-radius: 18px; padding: 10px 4px 8px; text-align: center; font-size: 11px; line-height: 1.2; color: var(--ink); position: relative; }
  .fd span { display: block; font-size: 32px; line-height: 40px; }
  .fd em { position: absolute; top: 6px; right: 8px; font-style: normal; font-weight: 700; font-size: 11px; color: var(--ink2); }
  .fd.no { background: rgba(78,59,51,.06); color: var(--ink2); }
  .fd.no span { filter: grayscale(1) opacity(.25); }
  .fd.rare:not(.no) { box-shadow: inset 0 0 0 2px #E9A93B; }
  #scrim { position: fixed; inset: 0; background: rgba(40,24,14,.25); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 15; }
  #scrim.on { opacity: 1; pointer-events: auto; }

  /* Cuando Eko está en el PC: su notita y el botón para llamarlo */
  #away { position: fixed; left: 50%; top: 50%; width: min(86vw, 340px); transform: translate(-50%, -50%) rotate(-1.5deg); border-radius: 24px; padding: 18px 18px 16px; text-align: center; z-index: 12; display: none; }
  #away.on { display: block; animation: pop .35s cubic-bezier(.3,1.4,.5,1); }
  #away .t { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  #away .s { font-size: 14px; color: var(--ink2); margin-bottom: 14px; line-height: 1.35; }
  #away button { border: 0; border-radius: 999px; background: #D0795A; color: #fff; font: 700 16px/1 inherit; padding: 13px 26px; box-shadow: 0 4px 10px rgba(208,121,90,.35); }
  #away button:active { transform: scale(.95); }
  #away button[disabled] { opacity: .6; }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(.8); opacity: 0; } }
  body.away #dock { opacity: .55; }
  /* Aviso si Eko no consigue cargar (para poder ver qué pasa en una captura) */
  #diag { position: fixed; left: 16px; right: 16px; top: 45%; padding: 12px 14px; border-radius: 16px; background: rgba(255,247,238,.95); font-size: 13px; color: #8a3b2a; display: none; z-index: 30; white-space: pre-wrap; }
</style>
</head><body>
<div id="backdrop"></div><div id="shade"></div>
<div id="room">
  <div id="sky">
    <div id="stars"></div>
    <img id="sun" src="art/valley/sun.webp" alt=""><img id="moon" src="art/valley/moon.webp" alt="">
    <img class="cloud" src="art/valley/cloud.webp" style="left:0;top:12%" alt="">
    <img class="cloud" src="art/valley/cloud.webp" style="left:45%;top:32%;width:36%;animation-duration:55s" alt="">
    <div id="far"></div><div id="mid"></div>
  </div>
  <div id="photo"></div>
  <img id="bg" src="art/casa-vertical.webp" alt="">
  <img id="libreta" src="art/movil-portada.webp" alt="">
  <div id="finds"></div>
  <div id="spots"></div>
  <div id="shadowF"></div>
  <iframe id="eko" src="overlay.html" title="Eko"></iframe>
  <img id="fg" src="art/casa-vertical.webp" alt="">
  <div id="ekoHit" class="spot"></div>
  <div id="night"></div>
  <div id="glow"><i style="left:512px;top:200px;width:900px;height:900px"></i><i style="left:968px;top:800px;width:520px;height:520px"></i></div>
</div>
<div id="bub"></div>

<div id="hud" class="glass">
  <div id="hudTop"><div id="name">Eko</div><div id="day"></div><button id="gear" aria-label="Ajustes"><img src="art/ui/ic-settings.webp" alt=""></button></div>
  <div id="needs">
    <div class="need" id="n-hunger" style="--c:#E9A93B"><img src="art/ui/cat-care.webp" alt="Hambre"><div class="bar"><i></i></div></div>
    <div class="need" id="n-fun" style="--c:#5FA88E"><img src="art/ui/cat-play.webp" alt="Diversión"><div class="bar"><i></i></div></div>
    <div class="need" id="n-love" style="--c:#D0795A"><img src="art/ui/ic-hand.webp" alt="Cariño"><div class="bar"><i></i></div></div>
    <div class="need" id="n-energy" style="--c:#6F94C2"><img src="art/valley/moon.webp" alt="Energía"><div class="bar"><i></i></div></div>
  </div>
</div>
<div id="dock" class="glass"></div>
<div id="scrim"></div>
<div id="ward" class="glass"><div class="handle"></div><h3>¿Qué me pongo?</h3><div class="grid"></div></div>

<div id="away" class="glass"><div class="t">Estoy en el PC contigo 💻</div><div class="s" id="awayS">Cuando me necesites aquí, llámame y vengo corriendo.</div><button id="comeBtn">¡Ven aquí!</button></div>

<script>
(() => {
  "use strict";
  const H = window.House;
  const $ = (id) => document.getElementById(id);
  const room = $("room"), frame = $("eko"), hit = $("ekoHit"), bub = $("bub");
  const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (_) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
  const pick = (l) => l[Math.floor(Math.random() * l.length)];

  // ---------- Escala: la habitación entera, entre la tarjeta de arriba y la barra de abajo ----------
  function fit() {
    const cs = getComputedStyle(document.documentElement);
    const top = parseFloat(cs.getPropertyValue("--top")) || 0, bottom = parseFloat(cs.getPropertyValue("--bottom")) || 0;
    const hudH = $("hud").offsetHeight + 10, dockH = $("dock").offsetHeight + 10;
    const availTop = top + hudH * 0.55, availBot = innerHeight - bottom - dockH * 0.35;   // la habitación asoma un poco por detrás de las barras
    const k = Math.min(innerWidth / 1024, (availBot - availTop) / 1536);
    const x = (innerWidth - 1024 * k) / 2, y = availTop + ((availBot - availTop) - 1536 * k) / 2;
    room.style.transform = `translate(${x}px, ${y}px) scale(${k})`;
    ROOM.k = k; ROOM.x = x; ROOM.y = y;
  }
  const ROOM = { k: 1, x: 0, y: 0 };
  const toRoom = (cx, cy) => [(cx - ROOM.x) / ROOM.k, (cy - ROOM.y) / ROOM.k];
  window.setInsets = (t, b) => { document.documentElement.style.setProperty("--top", t + "px"); document.documentElement.style.setProperty("--bottom", b + "px"); fit(); };
  addEventListener("resize", fit);

  // ---------- Eko dentro de casa (overlay.html en un marco; se le habla con postMessage) ----------
  // Tamaño de Eko acorde con los muebles (más o menos tan alto como el sillón)
  const S = 2.3, FLOOR = 1340, XMIN = 150, XMAX = 880;
  const E = { x: 300, y: FLOOR, dir: 1, target: null, mode: "idle", hold: 0, vy: 0, hop: 0, next: 0, onArrive: null, fx: 0, fy: 0, z: 0 };   // z: 0 = en el suelo de delante, 1 = sentado al fondo (sillón)
  // Mensajes a Eko: hasta que su marco no ha cargado se pierden, así que al cargar se le recuerda en qué estado está (ver sync)
  let ekoReady = false;
  const send = (fn, ...args) => ekoReady && frame.contentWindow && frame.contentWindow.postMessage({ eko: fn, args }, "*");
  const look = (mode) => frame.contentWindow && frame.contentWindow.postMessage({ look: mode }, "*");
  const scale = () => S * (1 - 0.48 * E.z);              // más lejos = más pequeño (en el sillón cabe entre los brazos)
  function place() {
    const y = E.y - E.hop, sc = scale(), f = sc / S;
    frame.style.left = E.x - 80 + "px"; frame.style.top = y - 250 + 4 + "px"; frame.style.transform = `scale(${sc})`;
    hit.style.left = E.x - 150 * f + "px"; hit.style.top = y - 380 * f + "px"; hit.style.width = 300 * f + "px"; hit.style.height = 400 * f + "px";
    // sombra: en el suelo bajo Eko (o en el sillón), más pequeña y suave cuanto más alto
    const ground = FLOOR + (SEAT.y - FLOOR) * E.z, h = Math.max(0, ground - y), k = 1 / (1 + h / 320);
    const sw = 80 * sc * k;
    const sh = $("shadowF");
    sh.style.left = E.x - sw / 2 + "px"; sh.style.top = ground - sw * 0.12 + "px"; sh.style.width = sw + "px"; sh.style.height = sw * 0.24 + "px";
    sh.style.opacity = (E.z > 0.9 ? 0 : k).toFixed(2);
    $("fg").style.display = E.z > 0.85 ? "block" : "none";
    // Bocadillo encima de su cabeza, en píxeles de pantalla (como en tu pantalla); no se estrecha junto a los bordes
    const rk = ROOM.k, feet = ROOM.y + y * rk, head = feet - 141 * sc * rk * 0.95;
    const half = (bub.offsetWidth || 160) / 2, bx = Math.min(innerWidth - half - 8, Math.max(half + 8, ROOM.x + E.x * rk));
    bub.style.left = bx + "px"; bub.style.top = Math.max(8, head - 8) + "px";
  }

  function openWard() {
    const cur = H && H.accMode ? H.accMode() : "auto";
    $("ward").querySelector(".grid").innerHTML = WARD.map((w) => `<button data-id="${w[0]}" class="${w[0] === cur ? "cur" : ""}">${w[1].startsWith("art/") ? `<img src="${w[1]}" alt="">` : `<span>${w[1]}</span>`}${w[2]}</button>`).join("");
    $("ward").classList.add("on"); $("scrim").classList.add("on");
  }
  function closeWard() { $("ward").classList.remove("on"); $("sheet").classList.remove("on"); $("scrim").classList.remove("on"); }
  function wardOpen() { return $("ward").classList.contains("on") || $("sheet").classList.contains("on"); }

  // ---------- Hojas: Paseos (hoy, semana, racha, hora dorada) y Colección ----------
  const fmtN = (x) => Number(x).toLocaleString("es-ES");
  const SEASON = { autumn: "otoño", winter: "invierno", spring: "primavera", summer: "verano" };
  function openSheet(kind, extra) {
    const b = $("sheetBody");
    if (kind === "walks") b.innerHTML = walksHtml();
    else if (kind === "cities") b.innerHTML = citiesHtml();
    else if (kind === "more") b.innerHTML = moreHtml();
    else b.innerHTML = findsHtml();
    $("ward").classList.remove("on");
    $("sheet").classList.add("on"); $("scrim").classList.add("on");
    $("sheet").scrollTop = 0;
  }
  window.house.openSheet = openSheet;
  function walksHtml() {
    const w = JSON.parse(H && H.walks ? H.walks() : '{"has":false}');
    let h = `<h3>Nuestros paseos</h3><p class="sub">Con el podómetro del móvil. Sin GPS: no sé por dónde vamos.</p>`;
    if (!w.has) h += `<div class="card">Este móvil no tiene podómetro, así que no puedo contar nuestros pasos.</div>`;
    else if (!w.allowed) h += `<div class="card row2"><img src="art/valley/sun.webp" alt=""><div class="t">Para contar nuestros pasos necesito el permiso de actividad física.</div><button class="pill" data-act="steps">Permitir</button></div>`;
    else {
      const p = Math.min(100, Math.round(w.steps / Math.max(1, w.goal) * 100));
      const max = Math.max(w.goal, ...w.week.map((d) => d.n)) * 1.1;
      h += `<div class="card hero"><div class="ring" style="--p:${p}"><div><b>${fmtN(w.steps)}</b><small>pasos hoy</small></div></div>
        <div class="t">${w.steps >= w.goal ? "<b>¡Meta cumplida!</b><br>" : `<b>${fmtN(Math.max(0, w.goal - w.steps))}</b> para la meta<br>`}Meta de hoy: ${fmtN(w.goal)} pasos</div></div>
        <div class="card"><div class="bars"><div class="goal" style="bottom:calc(${(w.goal / max * 100).toFixed(1)}% * (106 / 120) + 0px)"></div>
        ${w.week.map((d, i) => `<div class="bar2 ${d.n >= w.goal ? "ok" : ""} ${i === 6 ? "today" : ""}"><i style="height:${Math.max(3, d.n / max * 100).toFixed(1)}%"></i>${d.d}</div>`).join("")}</div></div>
        <div class="chips" style="margin-bottom:10px">${w.streak > 0 ? `<span class="chip">🔥 Racha: <b>${w.streak} ${w.streak === 1 ? "día" : "días"}</b></span>` : ""}<span class="chip">Semana: <b>${fmtN(w.weekTotal)}</b></span><span class="chip">Mejor día: <b>${fmtN(w.best)}</b></span></div>`;
    }
    h += `<div class="card row2"><img src="art/valley/sun.webp" alt=""><div class="t">${w.city ? `<b>Hora dorada</b> en ${w.city}: desde las ${w.gold || "–"}${w.sunset ? ` (el sol se pone a las ${w.sunset})` : ""}` : "<b>Hora dorada</b><br>Te aviso antes del atardecer para salir a hacer fotos"}</div>
      <button class="pill ${w.city ? "soft" : ""}" data-act="cities">${w.city ? "Cambiar" : "Activar"}</button></div>`;
    return h;
  }
  // Hoja «Más»: el resto de opciones, en una cuadrícula
  const MORE = [
    ["art/ui/ic-note.webp", "Diario", () => openOpt("diary"), true],
    ["\ud83e\udea8", "Colecci\u00f3n", () => openOpt("finds"), true],
    ["\ud83d\udca4", "Siesta", () => { closeWard(); if (E.mode === "sleep") wake(); else { say("Una siestecita\u2026", 1800); nap(); } }, true],
    ["\ud83d\udca1", "Luz", () => { closeWard(); say(toggleLights() ? "\u00a1Luz!" : "As\u00ed, m\u00e1s tranquilito", 1600); }, false],
    ["\ud83d\udeaa", "A tu pantalla", () => openOpt("door"), true],
    ["art/ui/ic-settings.webp", "Ajustes", () => openOpt("settings"), false],
  ];
  function moreHtml() {
    return `<h3>M\u00e1s</h3><p class="sub">Todo lo dem\u00e1s que podemos hacer</p><div class="more">${MORE.map((m, i) =>
      `<button data-more="${i}">${m[0].startsWith("art/") ? `<img src="${m[0]}" alt="">` : `<span>${m[0]}</span>`}${m[1]}</button>`).join("")}</div>`;
  }
  function citiesHtml() {
    const w = JSON.parse(H && H.walks ? H.walks() : '{"cities":[]}');
    return `<h3>¿Dónde haces fotos?</h3><p class="sub">Para saber a qué hora se pone el sol. Se calcula en el móvil, sin internet.</p>
      <div class="cities">${w.cities.map((c) => `<button data-city="${c}" class="${c === w.city ? "cur" : ""}">${c}</button>`).join("")}</div>
      <div style="text-align:center;margin-top:12px"><button class="pill soft" data-city="">No avisarme</button></div>`;
  }
  function findsHtml() {
    const l = JSON.parse(H && H.findsAll ? H.findsAll() : "[]");
    const got = l.filter((x) => x.n > 0).length;
    return `<h3>Mi colección</h3><p class="sub">Lo que encuentro mientras paseamos · ${got} de ${l.length}</p><div class="finds">${l.map((x) => x.n > 0
      ? `<div class="fd ${x.rare ? "rare" : ""}"><span>${x.emoji}</span>${x.name}${x.n > 1 ? `<em>×${x.n}</em>` : ""}</div>`
      : `<div class="fd no"><span>${x.emoji}</span>${x.rare ? "Rara" : x.season ? "De " + SEASON[x.season] : "???"}</div>`).join("")}</div>`;
  }
  $("sheet").addEventListener("click", (e) => {
    const m = e.target.closest("[data-more]");
    if (m) { const it = MORE[+m.dataset.more]; if (AWAY && it[3]) { closeWard(); nudgeAway(); return; } it[2](); return; }
    const a = e.target.closest("[data-act]"), c = e.target.closest("[data-city]");
    if (a && a.dataset.act === "steps") { H && H.askSteps(); return; }
    if (a && a.dataset.act === "cities") { openSheet("cities"); return; }
    if (c) { H && H.setCity(c.dataset.city); openSheet("walks"); if (c.dataset.city) say("¡Te avisaré antes de la hora dorada!", 2400); }
  });
  $("scrim").onclick = closeWard;
  $("ward").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; closeWard(); H && H.setAcc(b.dataset.id); look(b.dataset.id); });

  // ---------- Arranque (y aviso si Eko no carga) ----------
  // Al cargar Eko se le pone en el estado en que ya está (si estaba durmiendo en el sillón, sigue durmiendo ahí)
  function sync() {
    const st = { sleep: "sleep", walk: "walk", drag: "drag", fall: "fall" }[E.mode] || (jump ? "fall" : "idle");
    send("set", st, E.mode === "sleep" ? -1 : E.dir);
  }
  let firstReady = true;
  addEventListener("message", (e) => {
    const d = e.data || {};
    if (d.ready) {
      ekoReady = true;
      frame.contentWindow.postMessage({ noShadow: true }, "*");
      sync();
      if (firstReady) { firstReady = false; if (isNight() && E.mode === "idle" && !AWAY) setTimeout(nap, 800); }
    }
    if (d.error) { $("diag").style.display = "block"; $("diag").textContent += "Eko: " + d.error + "\n"; }
  });
  setTimeout(() => { if (!ekoReady) { $("diag").style.display = "block"; $("diag").textContent += "Eko no ha cargado en su casa (sin respuesta del marco).\n"; } }, 6000);
  function refresh() { sky(); photo(); finds(); needs(); }
  window.houseRefresh = refresh;
  fit(); refresh(); setInterval(sky, 60000); setInterval(needs, 10000);
  if (AWAY) showAway(true);
  place(); requestAnimationFrame(loop);
  setInterval(() => { if (E.mode !== "sleep" && !wardOpen()) send("chatter"); }, 150000);
  if (!isNight() && !AWAY) setTimeout(() => say(pick(["¡Bienvenido a mi casa!", "¡Hola! Pasa, pasa", "Toca las cosas de mi casa"]), 3000), 900);
})();
</script>
</body></html>
