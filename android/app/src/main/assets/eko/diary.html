<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  /* Diario con Eko: le cuentas tu día (hablando o escribiendo) y te contesta. Mismo estilo que su casa.
     Las acciones las hace Android (DiaryActivity, puente «App»). Todo se queda en el móvil. */
  :root { --ink: #4E3B33; --ink2: #8A7266; --cream: #FFF7EE; --glass: rgba(255, 247, 238, .82); --line: rgba(255, 255, 255, .7);
          --top: 24px; --bottom: 16px; --shadow: 0 10px 30px rgba(74, 44, 24, .16), 0 2px 6px rgba(74, 44, 24, .1); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: #d99a63; color: var(--ink); font-family: "Google Sans", Roboto, system-ui, sans-serif; }
  #backdrop { position: fixed; inset: -40px; background: url(art/casa-vertical.webp) center / cover no-repeat; filter: blur(26px) brightness(.9); transform: scale(1.08); z-index: -1; }
  main { padding: calc(var(--top) + 12px) 14px calc(var(--bottom) + 24px); max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; margin: 4px 4px 14px; }
  header button { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--glass); box-shadow: var(--shadow); font-size: 20px; color: var(--ink); }
  header h1 { margin: 0; font-size: 24px; font-weight: 700; color: #fff; text-shadow: 0 2px 8px rgba(60,30,10,.35); }
  .glass { background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .today { border-radius: 26px; padding: 16px; margin-bottom: 16px; }
  .today .d { font-size: 13px; color: var(--ink2); font-weight: 600; }
  .d::first-letter { text-transform: uppercase; }
  .today .q { font-size: 20px; font-weight: 700; margin: 2px 0 12px; display: flex; align-items: center; gap: 8px; }
  .today .q img { width: 30px; height: 30px; }
  textarea { width: 100%; min-height: 140px; border: 0; border-radius: 18px; background: rgba(255,255,255,.75); padding: 14px; font: 16px/1.45 inherit; color: var(--ink); resize: none; outline: none;
             background-image: repeating-linear-gradient(transparent 0 22.2px, rgba(201,162,122,.25) 22.2px 23.2px); background-position: 0 13px; }
  .acts { display: flex; gap: 10px; margin-top: 12px; }
  .acts button { flex: 1; border: 0; border-radius: 999px; padding: 14px; font: 700 15px/1 inherit; color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .mic { background: #6F94C2; } .save { background: #5FA88E; }
  .acts button:active { transform: scale(.96); }
  h2 { margin: 6px 6px 10px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 6px rgba(60,30,10,.35); }
  .page { border-radius: 20px; padding: 12px 14px; margin-bottom: 10px; position: relative; }
  .page .d { font-size: 12px; color: var(--ink2); font-weight: 600; margin-bottom: 4px; }
  .page p { margin: 0; font-size: 15px; line-height: 1.45; white-space: pre-wrap; }
  .page .x { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: var(--ink2); font-size: 16px; }
  .empty { text-align: center; color: #fff; font-size: 14px; text-shadow: 0 1px 6px rgba(60,30,10,.35); padding: 8px; }
  /* Respuesta de Eko */
  #reply { position: fixed; inset: 0; background: rgba(40,24,14,.3); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 10; }
  #reply.on { display: flex; }
  #reply .card { border-radius: 26px; padding: 22px 20px 18px; max-width: 360px; text-align: center; animation: pop .35s cubic-bezier(.3,1.4,.5,1); }
  #reply img { width: 58px; height: 58px; }
  #reply p { font-size: 18px; font-weight: 600; line-height: 1.4; margin: 8px 0 16px; }
  #reply button { border: 0; border-radius: 999px; background: #D0795A; color: #fff; font: 700 15px/1 inherit; padding: 12px 22px; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  #toast { position: fixed; left: 50%; bottom: calc(var(--bottom) + 22px); transform: translate(-50%, 20px); opacity: 0; transition: .25s; background: #4E3B33; color: #fff; border-radius: 16px; padding: 12px 16px; font-size: 14px; pointer-events: none; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head><body>
<div id="backdrop"></div>
<main>
  <header><button onclick="App.close()" aria-label="Volver">←</button><h1>Diario con Eko</h1></header>
  <div class="today glass">
    <div class="d" id="date"></div>
    <div class="q"><img src="art/ui/ic-note.webp" alt="">¿Qué tal ha ido el día?</div>
    <textarea id="text" placeholder="Cuéntaselo hablando (🎤) o escribiendo…"></textarea>
    <div class="acts"><button class="mic" id="mic">🎤 Hablar</button><button class="save" id="save">Guardar</button></div>
  </div>
  <h2 id="pastT" hidden>Días anteriores</h2>
  <div id="past"></div>
</main>
<div id="reply"><div class="card glass"><img src="art/ui/ic-hand.webp" alt=""><p id="replyT"></p><button id="replyOk">Gracias, Eko</button></div></div>
<div id="toast"></div>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  let tt = 0;
  const toast = window.toast = (t) => { const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => e.classList.remove("on"), 2400); };
  window.setInsets = (t, b) => { document.documentElement.style.setProperty("--top", t + "px"); document.documentElement.style.setProperty("--bottom", b + "px"); };
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const fmt = (t, withTime) => new Date(t).toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" }) +
    (withTime ? " · " + new Date(t).toLocaleTimeString("es-ES", { hour: "numeric", minute: "2-digit" }) : "");
  $("date").textContent = fmt(Date.now());

  // Lo que dicta Android se va añadiendo (se puede pulsar varias veces)
  window.addText = (said) => {
    const t = $("text"), cur = t.value.trim();
    const add = said.charAt(0).toUpperCase() + said.slice(1);
    t.value = cur ? `${cur} ${add}.` : `${add}.`;
  };
  $("mic").onclick = () => App.listen();
  $("save").onclick = () => {
    const t = $("text").value.trim();
    if (!t) { toast("Cuéntale algo primero"); return; }
    const r = App.save(t);
    $("text").value = "";
    $("replyT").textContent = r; $("reply").classList.add("on");
    render();
  };
  $("replyOk").onclick = () => $("reply").classList.remove("on");

  window.render = () => {
    const l = JSON.parse(App.list()).reverse();
    $("pastT").hidden = !l.length;
    $("past").innerHTML = l.length ? l.map((e) => `<div class="page glass"><div class="d">${fmt(e.t, true)}</div><p>${esc(e.x)}</p><button class="x" data-t="${e.t}" aria-label="Borrar">✕</button></div>`).join("")
      : `<div class="empty">Aquí irán guardándose tus días.</div>`;
  };
  $("past").addEventListener("click", (e) => {
    const b = e.target.closest(".x"); if (!b) return;
    if (b.dataset.sure) { App.remove(Number(b.dataset.t)); render(); toast("Página borrada"); }
    else { b.dataset.sure = "1"; b.textContent = "¿Borrar?"; b.style.width = "auto"; b.style.padding = "0 10px"; b.style.background = "#D0795A"; b.style.color = "#fff"; b.style.borderRadius = "999px"; b.style.fontSize = "12px"; }
  });
  render();
})();
</script>
</body></html>
