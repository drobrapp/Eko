<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* Álbum de Eko: una libreta que se pasa deslizando. Arte de Aitor en art/ (movil-*, washi-*). */
  :root { --cream: #FFF4E8; --ink: #5A463D; --ink2: #7A6458; --coral: #D0795A; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--cream); color: var(--ink); font-family: system-ui, sans-serif; overflow: hidden; }
  .hand { font-family: "Coming Soon", casual, cursive; }
  #book { display: flex; height: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; }
  #book::-webkit-scrollbar { display: none; }
  .slot { flex: 0 0 100%; height: 100%; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; padding: 18px 14px 44px; }
  /* Página: mantiene la proporción del dibujo (876 × 1273) */
  .page { position: relative; height: min(100%, calc((100vw - 28px) * 1.453)); aspect-ratio: 876 / 1273;
          background: url(art/movil-pagina.webp) center / 100% 100% no-repeat; }
  .area { position: absolute; left: 6%; right: 6%; top: 10%; bottom: 4%; }
  /* Polaroid: marco blanco sencillo, la foto y el comentario de Eko a mano */
  .pol { position: absolute; width: 54%; background: #fffdf8; padding: 3.5% 3.5% 0; border-radius: 3px;
         box-shadow: 0 6px 14px rgba(90,70,61,.22), 0 1px 3px rgba(90,70,61,.18); }
  .pol img.ph { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 1px; background: #F3DCC6; }
  .pol .cap { font-size: clamp(12px, 3.6vw, 17px); line-height: 1.15; padding: 7% 2% 8%; text-align: center; color: var(--ink); }
  .pol .date { display: block; font-size: .78em; color: var(--ink2); margin-top: 3px; }
  .tape { position: absolute; width: 46%; left: 27%; top: -6%; pointer-events: none; }
  .p0 { left: 2%; top: 0; transform: rotate(-4deg); }
  .p1 { right: 2%; bottom: 0; transform: rotate(3.5deg); }
  .solo { left: 20%; top: 14%; width: 60%; transform: rotate(-2deg); }
  .stk { position: absolute; font-size: clamp(26px, 8vw, 40px); filter: drop-shadow(0 2px 2px rgba(90,70,61,.25)); pointer-events: none; }
  /* Portada */
  .cover { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 0 22px; }
  .cover img { width: min(62vw, 300px); }
  .cover h1 { margin: 0; font-size: 30px; font-weight: 600; }
  .cover p { margin: 0; color: var(--ink2); font-size: 15px; max-width: 320px; }
  .btn { border: 0; border-radius: 22px; background: var(--coral); color: #fff; font-size: 17px; padding: 14px 26px; }
  #dots { position: fixed; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 14px; color: var(--ink2); }
  /* Foto en grande */
  #big { position: fixed; inset: 0; background: rgba(90,70,61,.55); display: none; align-items: center; justify-content: center; padding: 20px; }
  #big.on { display: flex; }
  #big .pol { position: relative; width: min(92vw, 520px); transform: rotate(-1deg); }
  #big .pol img.ph { aspect-ratio: auto; max-height: 62vh; object-fit: contain; background: #fffdf8; }
  #big .row { display: flex; gap: 10px; justify-content: center; padding-bottom: 16px; }
  #big .row button { border: 0; border-radius: 18px; padding: 10px 18px; font-size: 15px; }
  #big .keep { background: #5FA88E; color: #fff; } #big .del { background: #F3DCC6; color: var(--ink); }
</style>
</head><body>
<div id="book"></div>
<div id="dots"></div>
<div id="big"></div>
<script>
(() => {
  "use strict";
  const A = window.AlbumBridge;
  const book = document.getElementById("book"), dots = document.getElementById("dots"), big = document.getElementById("big");
  const TAPES = ["washi-coral", "washi-salvia", "washi-miel"];
  const fmt = (t) => new Date(t).toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" });
  // Pseudoaleatorio estable por foto (el mismo giro y la misma cinta cada vez que abres el álbum)
  const seed = (s) => { let h = 7; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return () => ((h = (h * 1103515245 + 12345) >>> 0) / 4294967296); };
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function polaroid(p, cls) {
    const r = seed(p.id);
    const rot = (r() * 6 - 3).toFixed(1), tape = TAPES[Math.floor(r() * 3)], trot = (r() * 10 - 5).toFixed(1);
    return `<div class="pol ${cls}" data-id="${p.id}" style="--r:${rot}deg">
      <img class="tape" src="art/${tape}.webp" style="transform:rotate(${trot}deg)" alt="">
      <img class="ph" src="${p.thumb}" loading="lazy" alt="">
      <div class="cap hand">${esc(p.caption)}<span class="date">${fmt(p.time)}</span></div></div>`;
  }

  let photos = [];
  function render() {
    const data = JSON.parse(A ? A.list() : '{"photos":[],"stickers":[]}');
    photos = data.photos.slice().reverse();   // la más reciente primero
    const st = data.stickers;
    let html = `<div class="slot"><div class="cover">
      <img src="art/movil-portada.webp" alt="">
      <h1 class="hand">Álbum de Eko</h1>
      <p>${photos.length ? `${photos.length} ${photos.length === 1 ? "foto" : "fotos"} · desliza para pasar las páginas` : "Aún no tiene fotos. Dale alguna, o comparte una con «Eko» desde la galería."}</p>
      <button class="btn" id="add">Darle fotos</button></div></div>`;
    for (let i = 0; i < photos.length; i += 2) {
      const a = photos[i], b = photos[i + 1], r = seed("pg" + i);
      let stickers = "";
      if (st.length) {   // pegatinas de lo que ha encontrado paseando, en los huecos libres
        const s1 = st[Math.floor(r() * st.length)], s2 = st[Math.floor(r() * st.length)];
        stickers = b ? `<span class="stk" style="right:6%;top:8%;transform:rotate(${(r()*30-15)|0}deg)">${s1}</span><span class="stk" style="left:6%;bottom:8%;transform:rotate(${(r()*30-15)|0}deg)">${s2}</span>`
                     : `<span class="stk" style="right:10%;bottom:10%">${s1}</span>`;
      }
      html += `<div class="slot"><div class="page"><div class="area">${b ? polaroid(a, "p0") + polaroid(b, "p1") : polaroid(a, "solo")}${stickers}</div></div></div>`;
    }
    book.innerHTML = html;
    document.getElementById("add").onclick = () => A && A.pick();
    book.querySelectorAll(".pol").forEach((el) => {
      el.style.transform = (el.style.transform || "") + "";
      el.onclick = () => open(el.dataset.id);
    });
    pageInfo();
  }

  function pageInfo() {
    const n = book.children.length, i = Math.round(book.scrollLeft / Math.max(1, book.clientWidth));
    dots.textContent = n > 1 ? (i === 0 ? "Portada" : `Página ${i} de ${n - 1}`) : "";
  }
  book.addEventListener("scroll", () => requestAnimationFrame(pageInfo), { passive: true });

  function open(id) {
    const p = photos.find((x) => x.id === id); if (!p) return;
    big.innerHTML = `<div class="pol"><img class="tape" src="art/washi-miel.webp" alt=""><img class="ph" src="${p.photo}" alt="">
      <div class="cap hand">${esc(p.caption)}<span class="date">${fmt(p.time)}</span></div>
      <div class="row"><button class="keep">Cerrar</button><button class="del">Quitar del álbum</button></div></div>`;
    big.classList.add("on");
    big.querySelector(".keep").onclick = close;
    big.querySelector(".del").onclick = () => { if (confirm("¿Quitar esta foto del álbum?")) { A && A.remove(id); close(); render(); } };
  }
  function close() { big.classList.remove("on"); big.innerHTML = ""; }
  big.addEventListener("click", (e) => { if (e.target === big) close(); });

  window.album = { reload: render, back() { if (big.classList.contains("on")) { close(); return true; } return false; } };
  render();
})();
</script>
</body></html>
