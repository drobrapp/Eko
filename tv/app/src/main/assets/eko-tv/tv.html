<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Eko TV</title>
<style>
/* Escena del Valle para la tele: el mismo decorado que src/world.html, sin nada que se pueda tocar */
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9CC9EE;user-select:none;cursor:none}
#sky{position:fixed;inset:0;transition:background 3s}
#sun{position:fixed;background:center/contain no-repeat;transition:left 3s,top 3s,filter 3s;animation:spin 120s linear infinite}
@keyframes spin{to{rotate:360deg}}
body.night #sun{animation:none}
#stars i{position:fixed;width:3px;height:3px;border-radius:50%;background:#FFF4E8;opacity:0;transition:opacity 3s}
.night #stars i{opacity:.85}
.cloud{position:fixed;left:0;opacity:.92;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(150,175,205,.3));will-change:transform}
/* Capas anchas que se desplazan con transform (por GPU): repintar el fondo en cada fotograma daba tirones en la tele */
.layer{position:fixed;left:0;bottom:0;background-repeat:repeat-x;background-size:auto 100%;pointer-events:none;will-change:transform}
#world{position:fixed;left:0;bottom:0;height:100%;will-change:transform}
.prop{position:absolute;transform-origin:50% 100%}
.prop img{width:100%;height:100%;display:block}
.prop.sway{animation:sway 6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(1.2deg)}}
.prop::before{content:"";position:absolute;left:8%;right:8%;bottom:-4px;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(45,60,25,.38),rgba(45,60,25,0));z-index:-1}
.glow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,214,140,.85),rgba(255,200,120,.25) 50%,transparent);opacity:0;transition:opacity 2s}
.lit .glow{opacity:1}
#signText,.plaque{position:absolute;text-align:center;font-weight:700;font-family:"Segoe Print","Comic Sans MS",cursive;color:#6b4a33;line-height:1.1;white-space:pre}
#sunflowers{position:absolute;z-index:3;background:url(art/valley/h-sunflowers.webp) repeat-x left bottom;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.bed-front{position:absolute;clip-path:inset(36% 0 0 0)}
#fogR,#fogL{position:absolute;bottom:0;height:100%}
#fogR{background:linear-gradient(90deg,rgba(255,255,255,0),rgba(250,248,244,.92) 35%,#f7f4ef 60%)}
#fogL{background:linear-gradient(270deg,rgba(255,255,255,0),rgba(250,248,244,.92) 35%,#f7f4ef 60%)}
.night #fogR,.night #fogL{filter:brightness(.45)}
.mist{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.9),transparent);animation:mist 9s ease-in-out infinite}
@keyframes mist{50%{transform:translateX(-40px) scale(1.1)}}
.flake{position:fixed;top:-10px;width:8px;height:8px;border-radius:50%;background:#fff;opacity:.9;animation:fall linear infinite}
.flake.leaf{width:12px;height:8px;border-radius:4px}
@keyframes fall{to{transform:translate(80px,110vh) rotate(300deg)}}
.fly{position:absolute;z-index:36;opacity:0;animation:flyAway 3.8s ease-in-out forwards}
@keyframes flyAway{10%{opacity:1}30%{transform:translate(calc(var(--dx)*.3),calc(var(--dy)*.4)) rotate(-12deg) scaleX(.7)}55%{transform:translate(calc(var(--dx)*.6),calc(var(--dy)*.6)) rotate(10deg)}80%{opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(-8deg);opacity:0}}
/* Eko: el mismo de la app del móvil (overlay.html) dentro de un marco, como en su casa */
#eko{position:absolute;left:0;top:0;width:160px;height:250px;border:0;background:transparent;transform-origin:50% 100%;z-index:20;will-change:transform}
/* Bocadillo grande, para leerlo desde el sofá */
#bub{position:fixed;z-index:50;transform:translate(-50%,-100%);background:#fffaf6;color:#3b2f2a;border-radius:.8em;box-shadow:0 6px 24px rgba(50,30,20,.28);text-align:center;opacity:0;transition:opacity .4s;font-family:"Segoe UI",system-ui,sans-serif;font-weight:600;line-height:1.25}
#bub.on{opacity:1}
#bub::after{content:"";position:absolute;left:50%;bottom:-.35em;width:.7em;height:.7em;margin-left:-.35em;background:#fffaf6;transform:rotate(45deg);border-radius:0 0 .2em 0}
/* Velo de noche: baja el brillo mientras duerme */
#dim{position:fixed;inset:0;z-index:60;background:#0b0f24;opacity:0;transition:opacity 6s;pointer-events:none}
#dim.on{opacity:.6}
#debug{position:fixed;left:8px;bottom:8px;z-index:70;font:14px monospace;color:#fff;background:rgba(0,0,0,.45);padding:4px 8px;border-radius:6px;display:none}
</style></head><body>
<div id="sky"></div><div id="sun"></div><div id="stars"></div><div id="clouds"></div>
<div class="layer" id="far"></div><div class="layer" id="mid"></div>
<div class="layer" id="ground"></div>
<div id="world"><div id="backL"></div><iframe id="eko" src="../eko/overlay.html" title="Eko" scrolling="no"></iframe><div id="frontL"></div></div>
<div id="bub"></div><div id="dim"></div><div id="debug"></div>
<script src="lines.js"></script>
<script src="tv.js"></script>
</body></html>
